kind = "web"
previewPath = "/"
title = "Meeting Branch"
version = "1.0.0"
id = "artifacts/famjam"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19634

[services.development]
run = "pnpm --filter @workspace/famjam run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/famjam", "run", "build" ]
serve = "static"
publicDir = "artifacts/famjam/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19634"
BASE_PATH = "/"
