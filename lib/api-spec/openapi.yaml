        reunionCreationEnabled:
          type: boolean
        signInsLocked:
          type: boolean
        testerEmails:
          type: array
          items:
            type: string
            minLength: 3

    AccessStatus:
      type: object
      required: [allowed, signInsLocked]
      properties:
        allowed:
          type: boolean
          description: "Whether the signed-in user may use the app right now"
        signInsLocked:
          type: boolean

    ShirtSize:
      type: string
      enum: [XS, S, M, L, XL, "2XL", "3XL"]

    PaymentStatus:
      type: string
      enum: [pending, paid, waived]

    RegistrationStatus:
      type: string
      enum: [active, cancelled]

    CancellationResolution:
      type: string
      enum: [refunded, donated_to_fund, no_payment]

    CancelRegistrationInput:
      type: object
      properties:
        resolution:
          type: string
          enum: [refunded, donated_to_fund]
          description: >
            Required when the registration is paid: refund outside the app, or
            donate the paid amount to the sponsorship fund. Ignored when
            nothing was paid.

    UpdateRegistrationInput:
      type: object
      required: [branchName, attendees]
      properties:
        branchName:
          type: string
          minLength: 1
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeInput"
          minItems: 1
        selectedFeeIds:
          type: array
          items:
            type: integer
          description: "IDs of OPTIONAL fees this household opted into. Mandatory fees always apply."

    TransferRegistrationInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [registration, payment]
        targetEmail:
          type: string
          minLength: 3
          description: "kind=registration: email of the account taking over this registration."
        targetRegistrationId:
          type: integer
          description: "kind=payment: registration (same reunion) that receives confirmed money."
        amountCents:
          type: integer
          minimum: 1
          description: "kind=payment: cents to move. Defaults to min(source confirmed money, target remaining balance)."

    MyContributionsResponse:
      type: object
      required: [contributions]
      properties:
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/SponsorshipContribution"

    PaymentMethod:
      type: string
      enum: [cashapp, zelle, cash, check]

    PaymentSubmissionInput:
      type: object
      required: [method, amount]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: number
          exclusiveMinimum: 0
          description: "Dollars and cents (at most 2 decimals) the registrant says they are paying. Informational only."
        registrationIds:
          type: array
          items:
            type: integer
          description: "All registrations this payment covers. Must include the path registration when non-empty. Defaults to just the path registration when omitted. Must not be empty (use the branch fee endpoint for a fee-only report)."
        contributionIds:
          type: array
          items:
            type: integer
          description: "Standalone fund chip-ins (contribution ids with no registration) this payment also covers."
        branchFeeElectionId:
          type: ["integer", "null"]
          description: "The member's own unpaid branch fee election to include IN FULL. Explicit opt-in only. Pending until confirmed."
        reference:
          type: ["string", "null"]
          description: "Method-specific reconciliation key: payer's $cashtag (cashapp), Zelle ID (zelle), who cash was handed to (cash), or check number/payer (check)."
        givenDate:
          type: ["string", "null"]
          description: "Date the cash was handed over (cash only), YYYY-MM-DD."
        note:
          type: ["string", "null"]
          description: "Free-form note from the registrant."

    SubmissionChipIn:
      type: object
      required: [id, amount, paymentStatus, createdAt]
      description: "Abbreviated chip-in record embedded in a payment submission so organizers can see exactly which contributions are covered."
      properties:
        standalone:
          type: boolean
          description: True for a direct (unattached) fund chip-in, settled all-or-nothing.
        id:
          type: integer
        contributorName:
          type: ["string", "null"]
        amount:
          type: integer
        paymentStatus:
          type: string
          enum: [pending, paid, waived]
        createdAt:
          type: string
          format: date-time

    PaymentSubmission:
      type: object
      required: [id, reunionId, registrationId, registrationIds, contributionIds, contributions, method, amount, createdAt]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        registrationId:
          type: ["integer", "null"]
          description: "Null for contribution-only submissions (standalone chip-in payments)."
        registrationIds:
          type: array
          items:
            type: integer
          description: "All registrations this payment covers (includes registrationId when set; empty for contribution-only submissions)."
        contributionIds:
          type: array
          items:
            type: integer
          description: "Standalone fund chip-ins this payment covers."
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionChipIn"
          description: "Resolved chip-in details for each id in contributionIds — contributor, amount, status, date."
        submittedBy:
          type: ["string", "null"]
        submittedByName:
          type: ["string", "null"]
          description: "Resolved display name (first + last) of the user who submitted this payment note."
        submittedByEmail:
          type: ["string", "null"]
          description: "Resolved email of the user who submitted this payment note."
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: number
        reference:
          type: ["string", "null"]
        givenDate:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        amountCents:
          type: integer
          description: Exact reported cents.
        confirmedReceiptId:
          type: integer
          nullable: true
          description: Live receipt that confirmed this reported payment, if any.
        branchFee:
          oneOf:
            - $ref: "#/components/schemas/SubmissionBranchFee"
            - type: "null"

    PaymentSubmissionList:
      type: object
      required: [submissions]
      properties:
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/PaymentSubmission"

    VendorCategory:
      type: string
      enum: [venue, park, caterer, supplier, entertainment, other]

    VendorStatus:
      type: string
      enum: [prospect, approved, rejected]

    VendorInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
        category:
          $ref: "#/components/schemas/VendorCategory"
        contactName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        quotedCost:
          type: ["integer", "null"]
