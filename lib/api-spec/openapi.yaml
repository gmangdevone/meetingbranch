        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        quotedCost:
          type: ["integer", "null"]
          minimum: 0
        notes:
          type: ["string", "null"]
        serviceDate:
          type: ["string", "null"]
        serviceEndDate:
          type: ["string", "null"]
        serviceStartTime:
          type: ["string", "null"]
        serviceEndTime:
          type: ["string", "null"]

    ReunionImageInput:
      type: object
