openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FamJam – multi-reunion family gathering platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: settings
    description: Platform-wide settings
  - name: reunions
    description: Reunion lifecycle and public reunion reads
  - name: registrations
    description: Reunion registrations
  - name: manage
    description: Reunion organizer management (organizer or platform admin)
  - name: admin
    description: Platform-admin-only operations
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      security:
        - clerkAuth: []
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Platform settings ───────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Public platform settings (e.g. whether reunion creation is enabled)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"

  /me/access:
    get:
      operationId: getMyAccess
      tags: [settings]
      summary: Whether the signed-in user may use the app under the current lockdown settings
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "401":
          description: Unauthorized

  # ── Reunion lifecycle & public reads ────────────────────────────────────────
  /reunions:
    post:
      operationId: createReunion
      tags: [reunions]
      summary: Create a new reunion (requires creation to be enabled)
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReunionInput"
      responses:
        "201":
          description: Reunion created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reunion"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Reunion creation is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/mine:
    get:
      operationId: listMyReunions
      tags: [reunions]
      summary: List reunions the current user organizes
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of reunions with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReunionSummary"
        "401":
          description: Unauthorized

  /reunions/by-code/{code}:
    get:
      operationId: getReunionByCode
      tags: [reunions]
      summary: Public lookup of a reunion by its 7-character code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reunion detail with branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reunion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/{reunionId}:
    get:
      operationId: getReunion
      tags: [manage]
      summary: Get a reunion for management (organizer or platform admin)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Reunion detail with branches and stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionSummary"
        "403":
          description: Forbidden
        "404":
          description: Not found
    put:
      operationId: updateReunion
      tags: [manage]
      summary: Update reunion settings (organizer or platform admin)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReunionUpdateInput"
      responses:
        "200":
          description: Updated reunion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reunion"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/summary:
    get:
      operationId: getReunionSummary
      tags: [reunions]
      summary: Public summary stats for a reunion – headcount, counts by branch
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSummary"

  /reunions/{reunionId}/announcements:
    get:
      operationId: listReunionAnnouncements
      tags: [reunions]
      summary: List a reunion's announcements (public)
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [manage]
      summary: Create an announcement for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "403":
          description: Forbidden

  /reunions/{reunionId}/announcements/{announcementId}:
    put:
      operationId: updateAnnouncement
      tags: [manage]
      summary: Update an announcement
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/AnnouncementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteAnnouncement
      tags: [manage]
      summary: Delete an announcement
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/AnnouncementId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/schedule:
    get:
      operationId: listReunionSchedule
      tags: [reunions]
      summary: List a reunion's schedule items (public)
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of schedule items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleItem"
    post:
      operationId: createScheduleItem
      tags: [manage]
      summary: Create a schedule item for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "201":
          description: Created schedule item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "403":
          description: Forbidden

  /reunions/{reunionId}/schedule/{scheduleId}:
    put:
      operationId: updateScheduleItem
      tags: [manage]
      summary: Update a schedule item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/ScheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "200":
          description: Updated schedule item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteScheduleItem
      tags: [manage]
      summary: Delete a schedule item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/fees:
    post:
      operationId: createFee
      tags: [manage]
      summary: Add a fee or dues item to a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeInput"
      responses:
        "201":
          description: Created fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionFee"
        "403":
          description: Forbidden

  /reunions/{reunionId}/fees/{feeId}:
    put:
      operationId: updateFee
      tags: [manage]
      summary: Update a fee or dues item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/FeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeInput"
      responses:
        "200":
          description: Updated fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionFee"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteFee
      tags: [manage]
      summary: Delete a fee or dues item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/FeeId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/branches:
    post:
      operationId: createBranch
      tags: [manage]
      summary: Add a branch/group to a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Created branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionBranch"
        "403":
          description: Forbidden

  /reunions/{reunionId}/branches/{branchId}:
    put:
      operationId: updateBranch
      tags: [manage]
      summary: Update a branch/group
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "200":
          description: Updated branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionBranch"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteBranch
      tags: [manage]
      summary: Delete a branch/group
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/BranchId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/registrations:
    get:
      operationId: listReunionRegistrations
      tags: [manage]
      summary: List all registrations for a reunion (organizer or platform admin)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of registrations with user info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRegistration"
        "403":
          description: Forbidden
    post:
      operationId: createManagedRegistration
      tags: [manage]
      summary: Register a family member on their behalf (organizer-created managed account)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedRegistrationInput"
      responses:
        "201":
          description: Created registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistration"
        "400":
          description: Invalid input
        "403":
          description: Forbidden

  /reunions/{reunionId}/registrations/export:
    get:
      operationId: exportReunionRegistrations
      tags: [manage]
      summary: Export a reunion's registrations as CSV
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "403":
          description: Forbidden

  /reunions/{reunionId}/registrations/{registrationId}/payment:
    patch:
      operationId: updateRegistrationPayment
      tags: [manage]
      summary: Update payment status for a registration
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentStatusInput"
      responses:
        "200":
          description: Updated registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistration"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/registrations/{registrationId}/cancel:
    post:
      operationId: cancelRegistration
      tags: [manage]
      summary: Cancel a registration (organizer with registration role)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRegistrationInput"
      responses:
        "200":
          description: Cancelled registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/attendees/{attendeeId}/check-in:
    patch:
      operationId: setAttendeeCheckIn
      tags: [manage]
      summary: Check an attendee in or out at the event
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/AttendeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "200":
          description: Updated attendee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/polls:
    get:
      operationId: listMemberPolls
      tags: [reunions]
      summary: List polls visible to a signed-in family member, with their votes and eligibility
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Member view of the reunion's polls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPollList"
    post:
      operationId: createPoll
      tags: [manage]
      summary: Create a poll with its initial options
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollInput"
      responses:
        "201":
          description: Created poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
        "403":
          description: Forbidden

  /reunions/{reunionId}/polls/manage:
    get:
      operationId: listManagePolls
      tags: [manage]
      summary: List all polls with vote counts and voter names (organizer view)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Organizer view of all polls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagePoll"
        "403":
          description: Forbidden

  /reunions/{reunionId}/polls/{pollId}:
    patch:
      operationId: updatePoll
      tags: [manage]
      summary: Update a poll (question, vote limit, open/close, reveal results)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/PollId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollUpdateInput"
      responses:
        "200":
          description: Updated poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deletePoll
      tags: [manage]
      summary: Delete a poll and all of its votes
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/PollId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/polls/{pollId}/options:
    post:
      operationId: addPollOption
      tags: [manage]
      summary: Add an option to an existing poll
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/PollId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollOptionInput"
      responses:
        "201":
          description: Created option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollOption"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/polls/{pollId}/options/{optionId}:
    delete:
      operationId: deletePollOption
      tags: [manage]
      summary: Remove a poll option (and any votes for it)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/PollId"
        - $ref: "#/components/parameters/PollOptionId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/polls/{pollId}/votes:
    put:
      operationId: castPollVotes
      tags: [reunions]
      summary: Cast or change the signed-in member's votes on an open poll
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/PollId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CastVotesInput"
      responses:
        "200":
          description: Updated member view of the poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPoll"
        "400":
          description: Invalid votes (too many selections, unknown option, or poll closed)
        "403":
          description: Not eligible to vote (not checked in)
        "404":
          description: Not found

  /reunions/{reunionId}/sponsorship:
    get:
      operationId: getSponsorshipFund
      tags: [manage]
      summary: Sponsorship fund balance and ledger (power user only)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Fund balance, contributions, and allocations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipFund"
        "403":
          description: Forbidden

  /reunions/{reunionId}/sponsorship/allocations:
    post:
      operationId: createSponsorshipAllocation
      tags: [manage]
      summary: Sponsor a registration from the fund or an individual sponsor (power user only)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipAllocationInput"
      responses:
        "201":
          description: Allocation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipFund"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden

  /reunions/{reunionId}/sponsorship/contributions:
    post:
      operationId: createSponsorshipContribution
      tags: [reunions]
      summary: Contribute to a reunion's sponsorship fund (any signed-in member)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipContributionInput"
      responses:
        "201":
          description: Contribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipContribution"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reunion not found

  /reunions/{reunionId}/sponsorship/my-contributions:
    get:
      operationId: getMyContributions
      tags: [reunions]
      summary: List the calling user's own contributions to a reunion's sponsorship fund
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: The caller's contribution history for this reunion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyContributionsResponse"
        "401":
          description: Unauthenticated
        "404":
          description: Reunion not found

  /reunions/{reunionId}/organizers:
    get:
      operationId: listReunionOrganizers
      tags: [manage]
      summary: List the organizers (owner + co-organizers) of a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of organizers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReunionOrganizer"
        "403":
          description: Forbidden
        "404":
          description: Not found
    post:
      operationId: addReunionOrganizer
      tags: [manage]
      summary: Add a co-organizer to a reunion by their account email
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrganizerInput"
      responses:
        "201":
          description: Added co-organizer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionOrganizer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: No account found with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already an organizer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/{reunionId}/organizers/{userId}:
    delete:
      operationId: removeReunionOrganizer
      tags: [manage]
      summary: Remove a co-organizer from a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "400":
          description: Cannot remove the reunion owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/organizers/{userId}/roles:
    put:
      operationId: updateOrganizerRoles
      tags: [manage]
      summary: Update a co-organizer's roles (owner or platform admin only)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizerRolesInput"
      responses:
        "200":
          description: Updated co-organizer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionOrganizer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the owner or a platform admin can assign roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Co-organizer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/{reunionId}/transfer-ownership:
    post:
      operationId: transferReunionOwnership
      tags: [manage]
      summary: Transfer reunion ownership to an existing co-organizer (owner only)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipInput"
      responses:
        "200":
          description: Updated list of organizers after the transfer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReunionOrganizer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the current owner can transfer ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reunion not found, or target is not a co-organizer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/{reunionId}/reports:
    get:
      operationId: getReunionReports
      tags: [manage]
      summary: Extended analytics report for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Full report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReport"
        "403":
          description: Forbidden

  # ── Registrations ────────────────────────────────────────────────────────────
  /registrations:
    post:
      operationId: createRegistration
      tags: [registrations]
      summary: Submit a new reunion registration
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /registrations/mine:
    get:
      operationId: listMyRegistrations
      tags: [registrations]
      summary: List the current user's registrations
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registration"
        "401":
          description: Unauthorized

  /registrations/{id}:
    get:
      operationId: getRegistration
      tags: [registrations]
      summary: Get a single registration with attendees
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found
    put:
      operationId: updateRegistration
      tags: [registrations]
      summary: Update a registration's branch, attendees, and optional fees
      description: >
        Organizers with the registration role (and platform admins) may edit any
        registration. The registrant may edit their own active registration when
        the reunion's allowRegistrantEdits setting is enabled.
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRegistrationInput"
      responses:
        "200":
          description: Updated registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /registrations/{id}/transfer:
    post:
      operationId: transferRegistration
      tags: [registrations]
      summary: Transfer a registration (or its payment) to someone else
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRegistrationInput"
      responses:
        "200":
          description: Updated registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /registrations/{id}/payment-submissions:
    post:
      operationId: createPaymentSubmission
      tags: [registrations]
      summary: Record a payment submission for reconciliation (never changes payment status)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSubmissionInput"
      responses:
        "201":
          description: Payment submission recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSubmission"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/payment-submissions:
    get:
      operationId: listPaymentSubmissions
      tags: [reunions]
      summary: List all payment submissions for a reunion (organizers with the registration role)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Payment submissions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSubmissionList"
        "403":
          description: Forbidden
        "404":
          description: Reunion not found

  # ── Platform admin ────────────────────────────────────────────────────────────
  /admin/setup-status:
    get:
      operationId: getAdminSetupStatus
      tags: [admin]
      summary: Report whether an administrator already exists (first-run bootstrap)
      responses:
        "200":
          description: Whether admin setup is still available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetupStatus"

  /admin/setup:
    get:
      operationId: adminSetup
      tags: [admin]
      summary: Claim admin access as the first operator (only while no admin exists)
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Caller is now the administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetupResult"
        "401":
          description: Unauthorized
        "409":
          description: Admin already exists; setup is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin]
      summary: Current platform settings including the tester allowlist
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlatformSettings"
        "403":
          description: Forbidden
    patch:
      operationId: adminUpdateSettings
      tags: [admin]
      summary: Update platform settings (reunion creation, sign-in lockdown, tester allowlist)
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsUpdateInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlatformSettings"
        "403":
          description: Forbidden

  /admin/reunions:
    get:
      operationId: adminListReunions
      tags: [admin]
      summary: List all reunions across the platform
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of reunions with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReunionSummary"
        "403":
          description: Forbidden

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all registered users with registration stats
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden

  /admin/users/{id}/admin:
    patch:
      operationId: adminToggleAdminFlag
      tags: [admin]
      summary: Grant or revoke platform-admin access for a user
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleAdminInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/users/{id}/remove:
    post:
      operationId: adminRemoveUser
      tags: [admin]
      summary: Remove a user account (blocked while they own a reunion; cannot remove yourself)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRemoveUserInput"
      responses:
        "204":
          description: User removed
        "400":
          description: Validation error or attempted self-removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: User still owns a reunion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  parameters:
    ReunionId:
      name: reunionId
      in: path
      required: true
      schema:
        type: integer
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: integer
    FeeId:
      name: feeId
      in: path
      required: true
      schema:
        type: integer
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema:
        type: integer
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: integer
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: integer
    AttendeeId:
      name: attendeeId
      in: path
      required: true
      schema:
        type: integer
    PollId:
      name: pollId
      in: path
      required: true
      schema:
        type: integer
    PollOptionId:
      name: optionId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    PlatformSettings:
      type: object
      required: [reunionCreationEnabled, signInsLocked]
      properties:
        reunionCreationEnabled:
          type: boolean
        signInsLocked:
          type: boolean

    AdminPlatformSettings:
      type: object
      required: [reunionCreationEnabled, signInsLocked, testerEmails]
      properties:
        reunionCreationEnabled:
          type: boolean
        signInsLocked:
          type: boolean
        testerEmails:
          type: array
          items:
            type: string

    AdminSettingsUpdateInput:
      type: object
      properties:
        reunionCreationEnabled:
          type: boolean
        signInsLocked:
          type: boolean
        testerEmails:
          type: array
          items:
            type: string
            minLength: 3

    AccessStatus:
      type: object
      required: [allowed, signInsLocked]
      properties:
        allowed:
          type: boolean
          description: "Whether the signed-in user may use the app right now"
        signInsLocked:
          type: boolean

    ShirtSize:
      type: string
      enum: [XS, S, M, L, XL, "2XL", "3XL"]

    PaymentStatus:
      type: string
      enum: [pending, paid, waived]

    RegistrationStatus:
      type: string
      enum: [active, cancelled]

    CancellationResolution:
      type: string
      enum: [refunded, donated_to_fund, no_payment]

    CancelRegistrationInput:
      type: object
      properties:
        resolution:
          type: string
          enum: [refunded, donated_to_fund]
          description: >
            Required when the registration is paid: refund outside the app, or
            donate the paid amount to the sponsorship fund. Ignored when
            nothing was paid.

    UpdateRegistrationInput:
      type: object
      required: [branchName, attendees]
      properties:
        branchName:
          type: string
          minLength: 1
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeInput"
          minItems: 1
        selectedFeeIds:
          type: array
          items:
            type: integer
          description: "IDs of OPTIONAL fees this household opted into. Mandatory fees always apply."

    TransferRegistrationInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [registration, payment]
        targetEmail:
          type: string
          minLength: 3
          description: "kind=registration: email of the account taking over this registration."
        targetRegistrationId:
          type: integer
          description: "kind=payment: registration (same reunion) that receives the paid status."

    MyContributionsResponse:
      type: object
      required: [contributions]
      properties:
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/SponsorshipContribution"

    PaymentMethod:
      type: string
      enum: [cashapp, zelle, cash, check]

    PaymentSubmissionInput:
      type: object
      required: [method, amount]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: integer
          minimum: 1
          description: "Whole-dollar amount the registrant says they are paying."
        reference:
          type: ["string", "null"]
          description: "Method-specific reconciliation key: payer's $cashtag (cashapp), Zelle ID (zelle), who cash was handed to (cash), or check number/payer (check)."
        givenDate:
          type: ["string", "null"]
          description: "Date the cash was handed over (cash only), YYYY-MM-DD."
        note:
          type: ["string", "null"]
          description: "Free-form note from the registrant."

    PaymentSubmission:
      type: object
      required: [id, reunionId, registrationId, method, amount, createdAt]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        registrationId:
          type: integer
        submittedBy:
          type: string
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: integer
        reference:
          type: ["string", "null"]
        givenDate:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    PaymentSubmissionList:
      type: object
      required: [submissions]
      properties:
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/PaymentSubmission"

    SponsorshipContributionInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1
        contributorName:
          type: ["string", "null"]

    SponsorshipContribution:
      type: object
      required: [id, amount, source, createdAt]
      properties:
        id:
          type: integer
        registrationId:
          type: ["integer", "null"]
        contributorName:
          type: ["string", "null"]
        amount:
          type: integer
        source:
          type: string
          enum: [registration, direct, cancellation]
        createdAt:
          type: string
          format: date-time

    SponsorshipAllocationInput:
      type: object
      required: [registrationId, amount, fundedFrom]
      properties:
        registrationId:
          type: integer
        amount:
          type: integer
          minimum: 1
        fundedFrom:
          type: string
          enum: [fund, direct]
        sponsorName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]

    SponsorshipAllocation:
      type: object
      required: [id, registrationId, amount, fundedFrom, createdAt]
      properties:
        id:
          type: integer
        registrationId:
          type: integer
        registrantName:
          type: ["string", "null"]
        registrantEmail:
          type: ["string", "null"]
        branchName:
          type: ["string", "null"]
        amount:
          type: integer
        fundedFrom:
          type: string
          enum: [fund, direct]
        sponsorName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SponsorshipFund:
      type: object
      required: [balance, totalContributed, totalAllocated, contributions, allocations]
      properties:
        balance:
          type: integer
          description: totalContributed minus fund-funded allocations
        totalContributed:
          type: integer
        totalAllocated:
          type: integer
          description: total applied from the fund (excludes direct sponsorships)
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/SponsorshipContribution"
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/SponsorshipAllocation"

    ReunionBranch:
      type: object
      required: [id, reunionId, name, sortOrder]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        name:
          type: string
        sortOrder:
          type: integer

    Reunion:
      type: object
      required:
        [id, code, name, startDate, endDate, paymentHandle, registrationsOpen, createdAt, branches, fees]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        startDate:
          type: string
          description: "ISO date (YYYY-MM-DD)"
        endDate:
          type: string
          description: "ISO date (YYYY-MM-DD)"
        paymentHandle:
          type: string
        paymentUrl:
          type: ["string", "null"]
        registrationsOpen:
          type: boolean
        allowRegistrantEdits:
          type: boolean
          description: "When true, registrants may edit their own active registrations."
        heroImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom hub hero background image (e.g. /objects/uploads/uuid). Null means the default background."
        scheduleCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom background image for the hub Schedule card. Null means the default look."
        announcementsCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom background image for the hub Announcements card. Null means the default look."
        pollsCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom background image for the hub Family Vote card. Null means the default look."
        cashAppTag:
          type: ["string", "null"]
          description: "Organizer's Cash App $cashtag for receiving payments (with or without the leading $). Null hides the Cash App payment option."
        checkPayee:
          type: ["string", "null"]
          description: "Who checks should be made out to. Null hides the check payment option."
        organizerId:
          type: string
        createdAt:
          type: string
          format: date-time
        branches:
          type: array
          items:
            $ref: "#/components/schemas/ReunionBranch"
        fees:
          type: array
          items:
            $ref: "#/components/schemas/ReunionFee"

    FeeChargeType:
      type: string
      enum: [per_person, flat]
      description: "per_person = charged once per attendee; flat = one flat amount per registration/household"

    ReunionFee:
      type: object
      required: [id, reunionId, label, chargeType, isOptional, amount, sortOrder]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        label:
          type: string
        chargeType:
          $ref: "#/components/schemas/FeeChargeType"
        isOptional:
          type: boolean
        amount:
          type: integer
          description: "Base amount — what attendees matching no age tier (or with no age on file) pay, or the flat amount"
        ageTiers:
          type: array
          items:
            $ref: "#/components/schemas/FeeAgeTier"
          description: "Age-bracket price overrides. Only applies to per_person fees."
        sortOrder:
          type: integer

    FeeAgeTier:
      type: object
      required: [minAge, maxAge, amount]
      description: "An attendee whose age is within [minAge, maxAge] (inclusive) pays this tier's amount instead of the fee's base amount. A null minAge means 'this age and below' (no lower bound); a null maxAge means 'this age and above' (no upper bound). At least one bound must be set."
      properties:
        minAge:
          type: ["integer", "null"]
          minimum: 0
        maxAge:
          type: ["integer", "null"]
          minimum: 0
        amount:
          type: integer
          minimum: 0

    FeeInput:
      type: object
      required: [label, chargeType, amount]
      properties:
        label:
          type: string
          minLength: 1
        chargeType:
          $ref: "#/components/schemas/FeeChargeType"
        isOptional:
          type: boolean
          default: false
        amount:
          type: integer
          minimum: 0
        ageTiers:
          type: array
          items:
            $ref: "#/components/schemas/FeeAgeTier"
          default: []
        sortOrder:
          type: integer
          default: 0

    ReunionRole:
      type: string
      enum: [registration, announcements, schedule, branches, reports, power_user]
      description: >-
        A delegable management area a co-organizer can be granted. power_user
        covers editing reunion details, payment, and fees & dues (but not
        managing organizers or transferring ownership, which stay owner-only).

    ReunionOrganizer:
      type: object
      required: [userId, email, isOwner, roles]
      properties:
        userId:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        isOwner:
          type: boolean
          description: True for the reunion creator/owner; false for added co-organizers
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ReunionRole"
          description: >-
            The roles granted to this co-organizer. Empty for the owner (whose
            access is implicit and full).

    ReunionViewerPermissions:
      type: object
      required: [isOwner, isAdmin, canManageOrganizers, roles]
      properties:
        isOwner:
          type: boolean
        isAdmin:
          type: boolean
        canManageOrganizers:
          type: boolean
          description: True only for the owner or a platform admin (add/remove organizers, assign roles, transfer ownership).
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ReunionRole"
          description: >-
            Effective roles for the current viewer. Owners and platform admins
            receive every role; co-organizers receive their assigned set.

    AddOrganizerInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ReunionRole"
          description: Roles to grant the new co-organizer. Defaults to none.

    UpdateOrganizerRolesInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ReunionRole"

    TransferOwnershipInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          minLength: 1
          description: The user id of an existing co-organizer to promote to owner

    ReunionSummary:
      type: object
      required: [reunion, registrationCount, attendeeCount]
      properties:
        reunion:
          $ref: "#/components/schemas/Reunion"
        registrationCount:
          type: integer
        attendeeCount:
          type: integer
        viewer:
          $ref: "#/components/schemas/ReunionViewerPermissions"
          description: >-
            The current viewer's permissions for this reunion. Populated by the
            manage detail endpoint (GET /reunions/{reunionId}); omitted elsewhere.

    ReunionInput:
      type: object
      required: [name, startDate, endDate, feePerPerson, paymentHandle, branches]
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          minLength: 1
        endDate:
          type: string
          minLength: 1
        feePerPerson:
          type: integer
          minimum: 0
          description: "Seed amount for the initial per-person 'Registration Fee'. More fees & dues can be added afterwards from settings."
        paymentHandle:
          type: string
          minLength: 1
        paymentUrl:
          type: string
        branches:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1

    ReunionUpdateInput:
      type: object
      description: "Partial update — only provided fields are changed."
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          minLength: 1
        endDate:
          type: string
          minLength: 1
        paymentHandle:
          type: string
          minLength: 1
        paymentUrl:
          type: string
        registrationsOpen:
          type: boolean
        allowRegistrantEdits:
          type: boolean
        heroImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom hub hero background image. Set null to restore the default."
        scheduleCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom Schedule card background. Set null to restore the default."
        announcementsCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom Announcements card background. Set null to restore the default."
        pollsCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom Family Vote card background. Set null to restore the default."
        cashAppTag:
          type: ["string", "null"]
          description: "Organizer's Cash App $cashtag. Set null to hide the Cash App payment option."
        checkPayee:
          type: ["string", "null"]
          description: "Who checks should be made out to. Set null to hide the check payment option."

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BranchInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        sortOrder:
          type: integer
          default: 0

    AttendeeInput:
      type: object
      required: [name, shirtSize]
      properties:
        name:
          type: string
          minLength: 1
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        dietaryRestrictions:
          type: string
        age:
          type: ["integer", "null"]
          minimum: 0

    Attendee:
      type: object
      required: [id, registrationId, name, shirtSize]
      properties:
        id:
          type: integer
        registrationId:
          type: integer
        name:
          type: string
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        dietaryRestrictions:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        checkedInAt:
          type: ["string", "null"]
          format: date-time
          description: When the attendee was checked in at the event; null if not checked in.

    CheckInInput:
      type: object
      required: [checkedIn]
      properties:
        checkedIn:
          type: boolean

    PollInput:
      type: object
      required: [question, maxVotesPerMember, options]
      properties:
        question:
          type: string
          minLength: 1
        maxVotesPerMember:
          type: integer
          minimum: 1
          maximum: 20
        options:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 2

    PollUpdateInput:
      type: object
      properties:
        question:
          type: string
          minLength: 1
        maxVotesPerMember:
          type: integer
          minimum: 1
          maximum: 20
        isOpen:
          type: boolean
        resultsRevealed:
          type: boolean
        liveResults:
          type: boolean

    PollOptionInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1

    PollOption:
      type: object
      required: [id, pollId, label, position]
      properties:
        id:
          type: integer
        pollId:
          type: integer
        label:
          type: string
        position:
          type: integer

    Poll:
      type: object
      required: [id, reunionId, question, maxVotesPerMember, isOpen, resultsRevealed, liveResults, createdAt, options]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        question:
          type: string
        maxVotesPerMember:
          type: integer
        isOpen:
          type: boolean
        resultsRevealed:
          type: boolean
        liveResults:
          type: boolean
        createdAt:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"

    PollOptionResult:
      type: object
      required: [optionId, label, voteCount]
      properties:
        optionId:
          type: integer
        label:
          type: string
        voteCount:
          type: integer
        voters:
          type: array
          items:
            type: string
          description: Voter display names. Only present in the organizer view.

    MemberPoll:
      type: object
      required: [poll, myOptionIds, canVote]
      properties:
        poll:
          $ref: "#/components/schemas/Poll"
        myOptionIds:
          type: array
          items:
            type: integer
        canVote:
          type: boolean
          description: True when the poll is open and the viewer is checked in.
        results:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionResult"
          description: Summarized results; only present when the organizer has revealed them.

    MemberPollList:
      type: object
      required: [eligible, polls]
      properties:
        eligible:
          type: boolean
          description: Whether the viewer is checked in and allowed to vote in this reunion.
        polls:
          type: array
          items:
            $ref: "#/components/schemas/MemberPoll"

    ManagePoll:
      type: object
      required: [poll, totalVoters, results]
      properties:
        poll:
          $ref: "#/components/schemas/Poll"
        totalVoters:
          type: integer
          description: Number of distinct members who have voted on this poll.
        results:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionResult"

    CastVotesInput:
      type: object
      required: [optionIds]
      properties:
        optionIds:
          type: array
          items:
            type: integer
          description: The full set of options the member is voting for (replaces previous votes).

    ManagedRegistrationInput:
      type: object
      required: [memberFirstName, branchName, attendees]
      properties:
        memberFirstName:
          type: string
          minLength: 1
        memberLastName:
          type: string
        branchName:
          type: string
          minLength: 1
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeInput"
          minItems: 1
        selectedFeeIds:
          type: array
          items:
            type: integer

    RegistrationInput:
      type: object
      required: [reunionId, branchName, attendees]
      properties:
        reunionId:
          type: integer
        branchName:
          type: string
          minLength: 1
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeInput"
          minItems: 1
        selectedFeeIds:
          type: array
          items:
            type: integer
          description: "IDs of OPTIONAL fees this household opted into. Mandatory fees always apply."
        sponsorshipContribution:
          type: integer
          minimum: 1
          description: "Optional extra amount donated to the reunion's sponsorship fund."

    Registration:
      type: object
      required:
        [id, reunionId, userId, branchName, attendeeCount, createdAt, attendees, paymentStatus, status]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        reunionName:
          type: ["string", "null"]
        reunionCode:
          type: ["string", "null"]
        userId:
          type: string
        branchName:
          type: string
        attendeeCount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        status:
          $ref: "#/components/schemas/RegistrationStatus"
        cancellationResolution:
          oneOf:
            - $ref: "#/components/schemas/CancellationResolution"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
        selectedFeeIds:
          type: array
          items:
            type: integer

    AdminRegistration:
      type: object
      required:
        [id, reunionId, userId, branchName, attendeeCount, createdAt, attendees, paymentStatus, userEmail, status, registrantIsManaged]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        userId:
          type: string
        userEmail:
          type: string
        userName:
          type: ["string", "null"]
        registrantIsManaged:
          type: boolean
          description: "True when this registration was created by an organizer on behalf of a member without their own account"
        branchName:
          type: string
        attendeeCount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        status:
          $ref: "#/components/schemas/RegistrationStatus"
        cancellationResolution:
          oneOf:
            - $ref: "#/components/schemas/CancellationResolution"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
        selectedFeeIds:
          type: array
          items:
            type: integer

    UpdatePaymentStatusInput:
      type: object
      required: [paymentStatus]
      properties:
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"

    RegistrationSummary:
      type: object
      required: [totalRegistrations, totalAttendees, byGroup]
      properties:
        totalRegistrations:
          type: integer
        totalAttendees:
          type: integer
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"

    GroupCount:
      type: object
      required: [branchName, registrationCount, attendeeCount]
      properties:
        branchName:
          type: string
        registrationCount:
          type: integer
        attendeeCount:
          type: integer

    ShirtSizeCount:
      type: object
      required: [shirtSize, count]
      properties:
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        count:
          type: integer

    DayRegistrationCount:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer

    AdminReport:
      type: object
      required:
        [totalRegistrations, totalAttendees, paidCount, pendingCount, waivedCount, dietaryCount, byGroup, byShirtSize, registrationsOverTime]
      properties:
        totalRegistrations:
          type: integer
        totalAttendees:
          type: integer
        paidCount:
          type: integer
        pendingCount:
          type: integer
        waivedCount:
          type: integer
        dietaryCount:
          type: integer
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"
        byShirtSize:
          type: array
          items:
            $ref: "#/components/schemas/ShirtSizeCount"
        registrationsOverTime:
          type: array
          items:
            $ref: "#/components/schemas/DayRegistrationCount"

    Announcement:
      type: object
      required: [id, reunionId, title, body, createdAt]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        pinned:
          type: boolean

    AnnouncementInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        pinned:
          type: boolean
          default: false

    ScheduleItem:
      type: object
      required: [id, reunionId, title, startTime, day]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        day:
          type: string
          description: "Day label, e.g. Thursday July 17"
        startTime:
          type: string
          description: "Time string, e.g. 9:00 AM"
        endTime:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        sortOrder:
          type: integer

    ScheduleItemInput:
      type: object
      required: [day, startTime, title]
      properties:
        day:
          type: string
          minLength: 1
        startTime:
          type: string
          minLength: 1
        endTime:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
        location:
          type: string
        sortOrder:
          type: integer
          default: 0

    AdminUser:
      type: object
      required: [id, email, isAdmin, createdAt, registrationCount, attendeeCount]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        registrationCount:
          type: integer
        attendeeCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    AdminRemoveUserInput:
      type: object
      required: [deleteRegistrations]
      properties:
        deleteRegistrations:
          type: boolean
          description: >
            When true, the user's registrations (with attendees and optional-fee
            selections) are deleted too. When false, registrations are kept on
            record but the user account is removed.

    ToggleAdminInput:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean

    AdminSetupStatus:
      type: object
      required: [adminExists]
      properties:
        adminExists:
          type: boolean

    AdminSetupResult:
      type: object
      required: [success, message, userId]
      properties:
        success:
          type: boolean
        message:
          type: string
        userId:
          type: string
