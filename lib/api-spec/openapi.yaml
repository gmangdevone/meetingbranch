      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrganizerInput"
      responses:
        "201":
          description: Added co-organizer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionOrganizer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: No account found with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already an organizer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/{reunionId}/organizers/{userId}:
    delete:
      operationId: removeReunionOrganizer
      tags: [manage]
      summary: Remove a co-organizer from a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "400":
          description: Cannot remove the reunion owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/organizers/{userId}/roles:
    put:
      operationId: updateOrganizerRoles
      tags: [manage]
      summary: Update a co-organizer's roles (owner or platform admin only)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizerRolesInput"
      responses:
        "200":
          description: Updated co-organizer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionOrganizer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the owner or a platform admin can assign roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Co-organizer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/{reunionId}/transfer-ownership:
    post:
      operationId: transferReunionOwnership
      tags: [manage]
      summary: Transfer reunion ownership to an existing co-organizer (owner only)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipInput"
      responses:
        "200":
          description: Updated list of organizers after the transfer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReunionOrganizer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the current owner can transfer ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reunion not found, or target is not a co-organizer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/{reunionId}/reports:
    get:
      operationId: getReunionReports
      tags: [manage]
      summary: Extended analytics report for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Full report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReport"
        "403":
          description: Forbidden

  # ── Registrations ────────────────────────────────────────────────────────────
  /registrations:
    post:
      operationId: createRegistration
      tags: [registrations]
      summary: Submit a new reunion registration
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /registrations/mine:
    get:
      operationId: listMyRegistrations
      tags: [registrations]
      summary: List the current user's registrations
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registration"
        "401":
          description: Unauthorized

  /registrations/{id}:
    get:
      operationId: getRegistration
      tags: [registrations]
      summary: Get a single registration with attendees
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found
    put:
      operationId: updateRegistration
      tags: [registrations]
      summary: Update a registration's branch, attendees, and optional fees
      description: >
        Organizers with the registration role (and platform admins) may edit any
        registration. The registrant may edit their own active registration when
        the reunion's allowRegistrantEdits setting is enabled.
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRegistrationInput"
      responses:
        "200":
          description: Updated registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /registrations/{id}/transfer:
    post:
      operationId: transferRegistration
      tags: [registrations]
      summary: Transfer a registration (or its payment) to someone else
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRegistrationInput"
      responses:
        "200":
          description: Updated registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /registrations/{id}/payment-submissions:
    post:
      operationId: createPaymentSubmission
      tags: [registrations]
      summary: Record a payment submission for reconciliation (never changes payment status)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSubmissionInput"
      responses:
        "201":
          description: Payment submission recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSubmission"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/payment-submissions:
    get:
      operationId: listPaymentSubmissions
      tags: [reunions]
      summary: List all payment submissions for a reunion (organizers with the registration role)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Payment submissions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSubmissionList"
        "403":
          description: Forbidden
        "404":
          description: Reunion not found

  # ── Vendors ───────────────────────────────────────────────────────────────────
  /reunions/{reunionId}/vendors:
    get:
      operationId: listVendors
      tags: [reunions]
      summary: List vendors for a reunion, with their contracts (Scout organizers)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Vendors with contracts, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorList"
        "403":
          description: Forbidden
        "404":
          description: Reunion not found
    post:
      operationId: createVendor
      tags: [reunions]
      summary: Add a vendor to evaluate (Scout organizers)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Reunion not found

  /reunions/{reunionId}/vendors/{vendorId}:
    put:
      operationId: updateVendor
      tags: [reunions]
      summary: Update a vendor; setting status to approved records the approval time (Scout organizers)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - name: vendorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdateInput"
      responses:
        "200":
          description: Vendor updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteVendor
      tags: [reunions]
      summary: Remove a vendor and its contracts (Scout organizers)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - name: vendorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Vendor deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/vendors/{vendorId}/contracts:
    post:
      operationId: createVendorContract
      tags: [reunions]
      summary: Attach an uploaded contract file to a vendor (Scout organizers)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - name: vendorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorContractInput"
      responses:
        "201":
          description: Contract attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorContract"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/vendors/{vendorId}/contracts/{contractId}:
    delete:
      operationId: deleteVendorContract
      tags: [reunions]
      summary: Remove a contract from a vendor (Scout organizers)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - name: vendorId
          in: path
          required: true
          schema:
            type: integer
        - name: contractId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Contract deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/images:
    get:
      operationId: listReunionImages
      tags: [reunions]
      summary: List the reunion's image library, newest first (power_user organizers)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Image library entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionImageList"
        "403":
          description: Forbidden
        "404":
          description: Reunion not found
    post:
      operationId: createReunionImage
      tags: [reunions]
      summary: Register an uploaded image in the library; re-registering the same objectPath returns the existing entry (power_user organizers)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReunionImageInput"
      responses:
        "201":
          description: Image registered (or already present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionImage"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Reunion not found

  /reunions/{reunionId}/images/{imageId}:
    delete:
      operationId: deleteReunionImage
      tags: [reunions]
      summary: Remove an image from the library (power_user organizers)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Image removed from library
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ── Platform admin ────────────────────────────────────────────────────────────
  /admin/setup-status:
    get:
      operationId: getAdminSetupStatus
      tags: [admin]
      summary: Report whether an administrator already exists (first-run bootstrap)
      responses:
        "200":
          description: Whether admin setup is still available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetupStatus"

  /admin/setup:
    get:
      operationId: adminSetup
      tags: [admin]
      summary: Claim admin access as the first operator (only while no admin exists)
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Caller is now the administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetupResult"
        "401":
          description: Unauthorized
        "409":
          description: Admin already exists; setup is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin]
      summary: Current platform settings including the tester allowlist
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlatformSettings"
        "403":
          description: Forbidden
    patch:
      operationId: adminUpdateSettings
      tags: [admin]
      summary: Update platform settings (reunion creation, sign-in lockdown, tester allowlist)
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsUpdateInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPlatformSettings"
        "403":
          description: Forbidden

  /admin/reunions:
    get:
      operationId: adminListReunions
      tags: [admin]
      summary: List all reunions across the platform
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of reunions with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReunionSummary"
        "403":
          description: Forbidden

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all registered users with registration stats
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden

  /admin/users/{id}/admin:
    patch:
      operationId: adminToggleAdminFlag
      tags: [admin]
      summary: Grant or revoke platform-admin access for a user
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleAdminInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/users/{id}/remove:
    post:
      operationId: adminRemoveUser
      tags: [admin]
      summary: Remove a user account (blocked while they own a reunion; cannot remove yourself)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRemoveUserInput"
      responses:
        "204":
          description: User removed
        "400":
          description: Validation error or attempted self-removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
        "409":
          description: User still owns a reunion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  # App names are independent of the Clerk profile editor.
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  parameters:
    ReunionId:
      name: reunionId
      in: path
      required: true
      schema:
        type: integer
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: integer
    FeeId:
      name: feeId
      in: path
      required: true
      schema:
        type: integer
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema:
        type: integer
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: integer
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: integer
    AttendeeId:
      name: attendeeId
      in: path
      required: true
      schema:
        type: integer
    PollId:
      name: pollId
      in: path
      required: true
      schema:
        type: integer
    PollOptionId:
      name: optionId
      in: path
      required: true
      schema:
        type: integer
    ActivityChoiceGroupId:
      name: activityChoiceGroupId
      in: path
      required: true
      schema:
        type: integer
    ActivityChoiceOptionId:
      name: activityChoiceOptionId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    PaymentRecipientStatus:
      type: string
      enum: [approved, pending_review, disabled]
      description: "approved = live destination; pending_review = no owner decision yet (legacy values held for review); disabled = owner turned Cash App off."
    PaymentRecipientPublic:
      type: object
      description: "Server-resolved receiving destination. All destination fields are null unless status is approved and the stored values pass validation."
      required: [reunionId, status, cashAppTag, cashAppUrl, paymentHandle, paymentUrl, zelleRecipientName, zelleContact, paymentInstructions, approvedAt]
      properties:
        reunionId:
          type: integer
        status:
          $ref: "#/components/schemas/PaymentRecipientStatus"
        cashAppTag:
          type: ["string", "null"]
        cashAppUrl:
          type: ["string", "null"]
        paymentHandle:
          type: ["string", "null"]
        paymentUrl:
          type: ["string", "null"]
        zelleRecipientName:
          type: ["string", "null"]
        zelleContact:
          type: ["string", "null"]
          description: "Owner-approved Zelle email or US phone. Payers send from their own banking app; there is no Zelle link."
        paymentInstructions:
          type: ["string", "null"]
          description: "Owner-approved public plain-text payment instructions (line breaks allowed). Render as text, never HTML."
        approvedAt:
          type: ["string", "null"]
          format: date-time
    PaymentOwnerCapability:
      type: object
      required: [isPaymentOwner]
      properties:
        isPaymentOwner:
          type: boolean
    PaymentRecipientValues:
      type: object
      required: [cashAppTag, paymentHandle, paymentUrl, zelleRecipientName, zelleContact, paymentInstructions]
      properties:
        cashAppTag:
          type: ["string", "null"]
        paymentHandle:
          type: ["string", "null"]
        paymentUrl:
          type: ["string", "null"]
        zelleRecipientName:
          type: ["string", "null"]
        zelleContact:
          type: ["string", "null"]
        paymentInstructions:
          type: ["string", "null"]
    OwnerRecipientListItem:
      type: object
      required: [reunionId, reunionName, reunionCode, startDate, status, cashAppTag, zelleContact, hasLegacyValues, version, updatedAt]
      properties:
        reunionId:
          type: integer
        reunionName:
          type: string
        reunionCode:
          type: string
        startDate:
          type: string
        status:
          $ref: "#/components/schemas/PaymentRecipientStatus"
        cashAppTag:
          type: ["string", "null"]
        zelleContact:
          type: ["string", "null"]
        hasLegacyValues:
          type: boolean
        version:
          type: integer
        updatedAt:
          type: ["string", "null"]
          format: date-time
    OwnerRecipientDetail:
      type: object
      required: [reunionId, reunionName, reunionCode, startDate, endDate, status, current, legacy, version, updatedAt, resolved]
      properties:
        reunionId:
          type: integer
        reunionName:
          type: string
        reunionCode:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        status:
          $ref: "#/components/schemas/PaymentRecipientStatus"
        current:
          $ref: "#/components/schemas/PaymentRecipientValues"
        legacy:
          $ref: "#/components/schemas/PaymentRecipientValues"
        version:
          type: integer
          description: "0 when the owner has never saved this reunion. Send as expectedVersion."
        updatedAt:
          type: ["string", "null"]
          format: date-time
        resolved:
          $ref: "#/components/schemas/PaymentRecipientPublic"
    OwnerRecipientSaveInput:
      type: object
      required: [expectedVersion, confirm]
      description: "At least one destination (cashAppTag, paymentHandle, paymentUrl, the Zelle name+contact pair, or paymentInstructions) is required. Generic https links are allowed; any cash.app link must match cashAppTag. Zelle name and contact must be provided together."
      properties:
        cashAppTag:
          type: ["string", "null"]
          maxLength: 21
        paymentHandle:
          type: ["string", "null"]
          maxLength: 120
        paymentUrl:
          type: ["string", "null"]
          maxLength: 300
        zelleRecipientName:
          type: ["string", "null"]
          maxLength: 80
        zelleContact:
          type: ["string", "null"]
          maxLength: 254
          description: "Email address or US phone number registered with Zelle."
        paymentInstructions:
          type: ["string", "null"]
          description: "Max 2000 characters after normalization (checked by the server). Public plain-text special payment instructions. Blank or null clears them."
        expectedVersion:
          type: integer
          minimum: 0
        confirm:
          type: boolean
          description: "Must be true: the owner explicitly confirmed the before/after values."
        note:
          type: ["string", "null"]
          maxLength: 500
    OwnerRecipientDisableInput:
      type: object
      required: [expectedVersion, confirm, scope]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        confirm:
          type: boolean
        scope:
          type: string
          enum: [cashapp, zelle, all]
          description: "cashapp = remove only the Cash App tag and cash.app links, keeping other approved destinations; zelle = remove only the Zelle name and contact; all = disable every payment destination for the reunion."
        note:
          type: ["string", "null"]
          maxLength: 500
    OwnerRecipientAuditEntry:
      type: object
      required: [id, reunionId, actor, action, previousValue, newValue, versionAfter, note, createdAt]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        actor:
          type: string
          description: "Display label for the actor (\"Platform owner\" for the configured owner)."
        action:
          type: string
          enum: [approve, change, disable, disable_cashapp, disable_zelle]
        previousValue:
          oneOf:
            - $ref: "#/components/schemas/PaymentRecipientAuditValue"
            - type: "null"
        newValue:
          $ref: "#/components/schemas/PaymentRecipientAuditValue"
        versionAfter:
          type: integer
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    PaymentRecipientAuditValue:
      type: object
      required: [status, cashAppTag, paymentHandle, paymentUrl]
      description: "Zelle fields are absent on entries written before Zelle support."
      properties:
        status:
