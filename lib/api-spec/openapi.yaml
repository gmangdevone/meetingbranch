openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Meeting Branch – multi-reunion family gathering platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: settings
    description: Platform-wide settings
  - name: reunions
    description: Reunion lifecycle and public reunion reads
  - name: registrations
    description: Reunion registrations
  - name: manage
    description: Reunion organizer management (organizer or platform admin)
  - name: admin
    description: Platform-admin-only operations
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /me/payment-owner:
    get:
      operationId: getMyPaymentOwnerCapability
      tags: [settings]
      summary: Whether the signed-in user is the configured platform payment owner (independent of isAdmin)
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOwnerCapability"
        "401":
          description: Unauthorized
  /reunions/{reunionId}/payment-recipient:
    get:
      operationId: getReunionPaymentRecipient
      tags: [reunions]
      summary: Freshly resolved, owner-approved receiving destination for a reunion (public)
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Resolved recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecipientPublic"
        "404":
          description: Not found
  /owner/payment-recipients:
    get:
      operationId: ownerListPaymentRecipients
      tags: [admin]
      summary: Platform owner only - list every reunion's recipient status
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Reunion recipient list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerRecipientListItem"
        "401":
          description: Unauthorized
        "403":
          description: Not the platform owner
  /owner/payment-recipients/{reunionId}:
    get:
      operationId: ownerGetPaymentRecipient
      tags: [admin]
      summary: Platform owner only - recipient detail including legacy values for review
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerRecipientDetail"
        "403":
          description: Not the platform owner
        "404":
          description: Not found
    put:
      operationId: ownerSavePaymentRecipient
      tags: [admin]
      summary: Platform owner only - approve or change the receiving destination (Cash App and/or generic link/label)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerRecipientSaveInput"
      responses:
        "200":
          description: Saved detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerRecipientDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the platform owner
        "404":
          description: Not found
        "409":
          description: Stale version - someone else changed this recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /owner/payment-recipients/{reunionId}/disable:
    post:
      operationId: ownerDisablePaymentRecipient
      tags: [admin]
      summary: Platform owner only - disable Cash App only, or all payment destinations, for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerRecipientDisableInput"
      responses:
        "200":
          description: Saved detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerRecipientDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the platform owner
        "404":
          description: Not found
        "409":
          description: Stale version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /owner/payment-recipients/{reunionId}/history:
    get:
      operationId: ownerListPaymentRecipientHistory
      tags: [admin]
      summary: Platform owner only - immutable recipient change history (newest first)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerRecipientAuditEntry"
        "403":
          description: Not the platform owner
        "404":
          description: Not found
  /me/profile:
    get:
      operationId: getMyProfile
      tags: [settings]
      security:
        - clerkAuth: []
      responses:
        "200":
          description: App-owned profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "401":
          description: Unauthorized
    put:
      operationId: updateMyProfile
      tags: [settings]
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "400":
          description: Invalid names
        "401":
          description: Unauthorized
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      security:
        - clerkAuth: []
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Platform settings ───────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Public platform settings (e.g. whether reunion creation is enabled)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"

  /me/access:
    get:
      operationId: getMyAccess
      tags: [settings]
      summary: Whether the signed-in user may use the app under the current lockdown settings
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "401":
          description: Unauthorized

  # ── Reunion lifecycle & public reads ────────────────────────────────────────
  /reunions:
    post:
      operationId: createReunion
      tags: [reunions]
      summary: Create a new reunion (requires creation to be enabled)
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReunionInput"
      responses:
        "201":
          description: Reunion created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reunion"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Reunion creation is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A unique Event Code could not be allocated after retries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/mine:
    get:
      operationId: listMyReunions
      tags: [reunions]
      summary: List reunions the current user organizes
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of reunions with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReunionSummary"
        "401":
          description: Unauthorized

  /me/event-memberships:
    get:
      operationId: listMyEventMemberships
      tags: [reunions]
      summary: Events the current user is associated with (deduplicated by reunion id)
      description: >
        One entry per reunion where the user is the organizer, an added co-organizer,
        or has at least one active (non-cancelled) registration. Admin visibility does
        not count as membership.
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Associated events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventMembership"
        "401":
          description: Unauthorized

  /reunions/by-code/{code}:
    get:
      operationId: getReunionByCode
      tags: [reunions]
      summary: Public lookup of an event by its event code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            minLength: 7
            maxLength: 32
            pattern: '^(?=.*[A-Za-z])(?=.*[0-9])[A-Za-z0-9*._~-]+$'
            description: "Modern Event Code, or a safe uppercase alphanumeric legacy code grandfathered before 2026-08-27."
      responses:
        "200":
          description: Reunion detail with branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reunion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/{reunionId}:
    get:
      operationId: getReunion
      tags: [manage]
      summary: Get a reunion for management (organizer or platform admin)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Reunion detail with branches and stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionSummary"
        "403":
          description: Forbidden
        "404":
          description: Not found
    put:
      operationId: updateReunion
      tags: [manage]
      summary: Update reunion settings (organizer or platform admin)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReunionUpdateInput"
      responses:
        "200":
          description: Updated reunion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reunion"
        "400":
          description: Invalid event code or settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Event code is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/summary:
    get:
      operationId: getReunionSummary
      tags: [reunions]
      summary: Public summary stats for a reunion – headcount, counts by branch
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSummary"

  /reunions/{reunionId}/announcements:
    get:
      operationId: listReunionAnnouncements
      tags: [reunions]
      summary: List a reunion's announcements (public)
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [manage]
      summary: Create an announcement for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "403":
          description: Forbidden

  /reunions/{reunionId}/announcements/{announcementId}:
    put:
      operationId: updateAnnouncement
      tags: [manage]
      summary: Update an announcement
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/AnnouncementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteAnnouncement
      tags: [manage]
      summary: Delete an announcement
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/AnnouncementId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/schedule:
    get:
      operationId: listReunionSchedule
      tags: [reunions]
      summary: List a reunion's schedule items (public)
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of schedule items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleItem"
    post:
      operationId: createScheduleItem
      tags: [manage]
      summary: Create a schedule item for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "201":
          description: Created schedule item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "403":
          description: Forbidden

  /reunions/{reunionId}/schedule/{scheduleId}:
    put:
      operationId: updateScheduleItem
      tags: [manage]
      summary: Update a schedule item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/ScheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "200":
          description: Updated schedule item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteScheduleItem
      tags: [manage]
      summary: Delete a schedule item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/fees:
    post:
      operationId: createFee
      tags: [manage]
      summary: Add a fee or dues item to a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeInput"
      responses:
        "201":
          description: Created fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionFee"
        "403":
          description: Forbidden

  /reunions/{reunionId}/fees/{feeId}:
    put:
      operationId: updateFee
      tags: [manage]
      summary: Update a fee or dues item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/FeeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeInput"
      responses:
        "200":
          description: Updated fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionFee"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteFee
      tags: [manage]
      summary: Delete a fee or dues item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/FeeId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/branches:
    post:
      operationId: createBranch
      tags: [manage]
      summary: Add a branch/group to a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Created branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionBranch"
        "403":
          description: Forbidden

  /reunions/{reunionId}/branches/{branchId}:
    put:
      operationId: updateBranch
      tags: [manage]
      summary: Update a branch/group
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "200":
          description: Updated branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionBranch"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteBranch
      tags: [manage]
      summary: Delete a branch/group
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/BranchId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/registrations:
    get:
      operationId: listReunionRegistrations
      tags: [manage]
      summary: List all registrations for a reunion (organizer or platform admin)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of registrations with user info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRegistration"
        "403":
          description: Forbidden
    post:
      operationId: createManagedRegistration
      tags: [manage]
      summary: Register a family member on their behalf (organizer-created managed account)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedRegistrationInput"
      responses:
        "201":
          description: Created registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistration"
        "400":
          description: Invalid input
        "403":
          description: Forbidden

  /reunions/{reunionId}/registrations/export:
    get:
      operationId: exportReunionRegistrations
      tags: [manage]
      summary: Export a reunion's registrations as CSV
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "403":
          description: Forbidden

  /reunions/{reunionId}/registrations/{registrationId}/payment:
    patch:
      operationId: updateRegistrationPayment
      tags: [manage]
      summary: Update payment status for a registration
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentStatusInput"
      responses:
        "200":
          description: Updated registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistration"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /registrations/{id}/ledger:
    get:
      operationId: getRegistrationLedger
      tags: [registrations]
      summary: Balance and confirmed payment history (registrant or registration manager)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationLedgerResponse" }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /reunions/{reunionId}/branches/{branchId}/special-fee:
    put:
      operationId: updateBranchSpecialFee
      tags: [manage]
      summary: Configure a branch's once-per-branch special fee (power users). Unpaid elections follow the new amount.
