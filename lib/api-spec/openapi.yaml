openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FamJam – Lacey Family Reunion API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: registrations
    description: Reunion registrations
  - name: announcements
    description: Family announcements
  - name: schedule
    description: Reunion schedule items
  - name: admin
    description: Admin-only operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /registrations:
    post:
      operationId: createRegistration
      tags: [registrations]
      summary: Submit a new reunion registration
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /registrations/mine:
    get:
      operationId: listMyRegistrations
      tags: [registrations]
      summary: List the current user's registrations
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registration"
        "401":
          description: Unauthorized

  /registrations/summary:
    get:
      operationId: getRegistrationSummary
      tags: [registrations]
      summary: Summary stats – total headcount, count by sibling group
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSummary"

  /registrations/{id}:
    get:
      operationId: getRegistration
      tags: [registrations]
      summary: Get a single registration with attendees
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found

  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List all family announcements
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"

  /schedule:
    get:
      operationId: listScheduleItems
      tags: [schedule]
      summary: List all reunion schedule items
      responses:
        "200":
          description: List of schedule items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleItem"

  # ── Admin endpoints ────────────────────────────────────────────────────────

  /admin/registrations:
    get:
      operationId: adminListRegistrations
      tags: [admin]
      summary: List all registrations (admin)
      security:
        - clerkAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: siblingName
          in: query
          schema:
            $ref: "#/components/schemas/SiblingName"
        - name: paymentStatus
          in: query
          schema:
            $ref: "#/components/schemas/PaymentStatus"
      responses:
        "200":
          description: Paginated list of registrations with user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistrationListResponse"
        "403":
          description: Forbidden

  /admin/registrations/export:
    get:
      operationId: adminExportRegistrations
      tags: [admin]
      summary: Export all registrations as CSV
      security:
        - clerkAuth: []
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "403":
          description: Forbidden

  /admin/registrations/{id}/payment:
    patch:
      operationId: adminUpdatePaymentStatus
      tags: [admin]
      summary: Update payment status for a registration
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentStatusInput"
      responses:
        "200":
          description: Updated registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistration"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/reports:
    get:
      operationId: adminGetReports
      tags: [admin]
      summary: Extended analytics report (shirt sizes, dietary counts, registrations over time)
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Full report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReport"
        "403":
          description: Forbidden

  /admin/announcements:
    post:
      operationId: adminCreateAnnouncement
      tags: [admin]
      summary: Create a new announcement
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "403":
          description: Forbidden

  /admin/announcements/{id}:
    put:
      operationId: adminUpdateAnnouncement
      tags: [admin]
      summary: Update an announcement
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: adminDeleteAnnouncement
      tags: [admin]
      summary: Delete an announcement
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/schedule:
    post:
      operationId: adminCreateScheduleItem
      tags: [admin]
      summary: Create a schedule item
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "201":
          description: Created schedule item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "403":
          description: Forbidden

  /admin/schedule/{id}:
    put:
      operationId: adminUpdateScheduleItem
      tags: [admin]
      summary: Update a schedule item
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "200":
          description: Updated schedule item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: adminDeleteScheduleItem
      tags: [admin]
      summary: Delete a schedule item
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all registered users with registration stats
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden

  /admin/users/{id}/admin:
    patch:
      operationId: adminToggleAdminFlag
      tags: [admin]
      summary: Grant or revoke admin access for a user
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleAdminInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
        "404":
          description: Not found

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SiblingName:
      type: string
      enum:
        - John
        - Louise
        - Willie Mae
        - June
        - Frances
        - Edna
        - Loretta
        - Betty
        - Dorothy
        - Richard

    ShirtSize:
      type: string
      enum: [XS, S, M, L, XL, "2XL", "3XL"]

    PaymentStatus:
      type: string
      enum: [pending, paid, waived]

    AttendeeInput:
      type: object
      required: [name, shirtSize]
      properties:
        name:
          type: string
          minLength: 1
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        dietaryRestrictions:
          type: string

    Attendee:
      type: object
      required: [id, registrationId, name, shirtSize]
      properties:
        id:
          type: integer
        registrationId:
          type: integer
        name:
          type: string
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        dietaryRestrictions:
          type: ["string", "null"]

    RegistrationInput:
      type: object
      required: [siblingName, attendees]
      properties:
        siblingName:
          $ref: "#/components/schemas/SiblingName"
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeInput"
          minItems: 1

    Registration:
      type: object
      required: [id, userId, siblingName, attendeeCount, createdAt, attendees, paymentStatus]
      properties:
        id:
          type: integer
        userId:
          type: string
        siblingName:
          $ref: "#/components/schemas/SiblingName"
        attendeeCount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        createdAt:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"

    AdminRegistration:
      type: object
      required: [id, userId, siblingName, attendeeCount, createdAt, attendees, paymentStatus, userEmail]
      properties:
        id:
          type: integer
        userId:
          type: string
        userEmail:
          type: string
        userName:
          type: ["string", "null"]
        siblingName:
          $ref: "#/components/schemas/SiblingName"
        attendeeCount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        createdAt:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"

    AdminRegistrationListResponse:
      type: object
      required: [registrations, total, page, limit]
      properties:
        registrations:
          type: array
          items:
            $ref: "#/components/schemas/AdminRegistration"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    UpdatePaymentStatusInput:
      type: object
      required: [paymentStatus]
      properties:
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"

    RegistrationSummary:
      type: object
      required: [totalRegistrations, totalAttendees, byGroup]
      properties:
        totalRegistrations:
          type: integer
        totalAttendees:
          type: integer
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"

    GroupCount:
      type: object
      required: [siblingName, registrationCount, attendeeCount]
      properties:
        siblingName:
          $ref: "#/components/schemas/SiblingName"
        registrationCount:
          type: integer
        attendeeCount:
          type: integer

    ShirtSizeCount:
      type: object
      required: [shirtSize, count]
      properties:
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        count:
          type: integer

    DayRegistrationCount:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer

    AdminReport:
      type: object
      required: [totalRegistrations, totalAttendees, paidCount, pendingCount, waivedCount, dietaryCount, byGroup, byShirtSize, registrationsOverTime]
      properties:
        totalRegistrations:
          type: integer
        totalAttendees:
          type: integer
        paidCount:
          type: integer
        pendingCount:
          type: integer
        waivedCount:
          type: integer
        dietaryCount:
          type: integer
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"
        byShirtSize:
          type: array
          items:
            $ref: "#/components/schemas/ShirtSizeCount"
        registrationsOverTime:
          type: array
          items:
            $ref: "#/components/schemas/DayRegistrationCount"

    Announcement:
      type: object
      required: [id, title, body, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        pinned:
          type: boolean

    AnnouncementInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        pinned:
          type: boolean
          default: false

    ScheduleItem:
      type: object
      required: [id, title, startTime, day]
      properties:
        id:
          type: integer
        day:
          type: string
          description: "Day label, e.g. Thursday July 17"
        startTime:
          type: string
          description: "Time string, e.g. 9:00 AM"
        endTime:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        sortOrder:
          type: integer

    ScheduleItemInput:
      type: object
      required: [day, startTime, title]
      properties:
        day:
          type: string
          minLength: 1
        startTime:
          type: string
          minLength: 1
        endTime:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
        location:
          type: string
        sortOrder:
          type: integer
          default: 0

    AdminUser:
      type: object
      required: [id, email, isAdmin, createdAt, registrationCount, attendeeCount]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        registrationCount:
          type: integer
        attendeeCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ToggleAdminInput:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
