        serviceDate:
          type: ["string", "null"]
          description: "Contracted service start date, YYYY-MM-DD."
        serviceEndDate:
          type: ["string", "null"]
          description: "Contracted service end date, YYYY-MM-DD (optional; for multi-day service)."
        serviceStartTime:
          type: ["string", "null"]
          description: "Service start time, HH:MM (24h)."
        serviceEndTime:
          type: ["string", "null"]
          description: "Service end time, HH:MM (24h)."

    VendorUpdateInput:
      type: object
