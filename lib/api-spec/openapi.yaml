            $ref: "#/components/schemas/ReunionImage"

    VendorContractInput:
      type: object
      required: [fileName, objectPath]
      properties:
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1
          description: "Object path returned by the upload-URL endpoint (/objects/...)."

    VendorContract:
      type: object
      required: [id, vendorId, reunionId, fileName, objectPath, uploadedBy, createdAt]
      properties:
        id:
          type: integer
