openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FamJam – multi-reunion family gathering platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: settings
    description: Platform-wide settings
  - name: reunions
    description: Reunion lifecycle and public reunion reads
  - name: registrations
    description: Reunion registrations
  - name: manage
    description: Reunion organizer management (organizer or platform admin)
  - name: admin
    description: Platform-admin-only operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Platform settings ───────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Public platform settings (e.g. whether reunion creation is enabled)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"

  # ── Reunion lifecycle & public reads ────────────────────────────────────────
  /reunions:
    post:
      operationId: createReunion
      tags: [reunions]
      summary: Create a new reunion (requires creation to be enabled)
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReunionInput"
      responses:
        "201":
          description: Reunion created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reunion"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Reunion creation is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/mine:
    get:
      operationId: listMyReunions
      tags: [reunions]
      summary: List reunions the current user organizes
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of reunions with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReunionSummary"
        "401":
          description: Unauthorized

  /reunions/by-code/{code}:
    get:
      operationId: getReunionByCode
      tags: [reunions]
      summary: Public lookup of a reunion by its 7-character code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reunion detail with branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reunion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reunions/{reunionId}:
    get:
      operationId: getReunion
      tags: [manage]
      summary: Get a reunion for management (organizer or platform admin)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Reunion detail with branches and stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionSummary"
        "403":
          description: Forbidden
        "404":
          description: Not found
    put:
      operationId: updateReunion
      tags: [manage]
      summary: Update reunion settings (organizer or platform admin)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReunionUpdateInput"
      responses:
        "200":
          description: Updated reunion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reunion"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/summary:
    get:
      operationId: getReunionSummary
      tags: [reunions]
      summary: Public summary stats for a reunion – headcount, counts by branch
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSummary"

  /reunions/{reunionId}/announcements:
    get:
      operationId: listReunionAnnouncements
      tags: [reunions]
      summary: List a reunion's announcements (public)
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [manage]
      summary: Create an announcement for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "403":
          description: Forbidden

  /reunions/{reunionId}/announcements/{announcementId}:
    put:
      operationId: updateAnnouncement
      tags: [manage]
      summary: Update an announcement
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/AnnouncementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteAnnouncement
      tags: [manage]
      summary: Delete an announcement
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/AnnouncementId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/schedule:
    get:
      operationId: listReunionSchedule
      tags: [reunions]
      summary: List a reunion's schedule items (public)
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of schedule items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleItem"
    post:
      operationId: createScheduleItem
      tags: [manage]
      summary: Create a schedule item for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "201":
          description: Created schedule item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "403":
          description: Forbidden

  /reunions/{reunionId}/schedule/{scheduleId}:
    put:
      operationId: updateScheduleItem
      tags: [manage]
      summary: Update a schedule item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/ScheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "200":
          description: Updated schedule item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteScheduleItem
      tags: [manage]
      summary: Delete a schedule item
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/branches:
    post:
      operationId: createBranch
      tags: [manage]
      summary: Add a branch/group to a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "201":
          description: Created branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionBranch"
        "403":
          description: Forbidden

  /reunions/{reunionId}/branches/{branchId}:
    put:
      operationId: updateBranch
      tags: [manage]
      summary: Update a branch/group
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchInput"
      responses:
        "200":
          description: Updated branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReunionBranch"
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteBranch
      tags: [manage]
      summary: Delete a branch/group
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/BranchId"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/registrations:
    get:
      operationId: listReunionRegistrations
      tags: [manage]
      summary: List all registrations for a reunion (organizer or platform admin)
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: List of registrations with user info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRegistration"
        "403":
          description: Forbidden

  /reunions/{reunionId}/registrations/export:
    get:
      operationId: exportReunionRegistrations
      tags: [manage]
      summary: Export a reunion's registrations as CSV
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "403":
          description: Forbidden

  /reunions/{reunionId}/registrations/{registrationId}/payment:
    patch:
      operationId: updateRegistrationPayment
      tags: [manage]
      summary: Update payment status for a registration
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
        - $ref: "#/components/parameters/RegistrationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentStatusInput"
      responses:
        "200":
          description: Updated registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRegistration"
        "403":
          description: Forbidden
        "404":
          description: Not found

  /reunions/{reunionId}/reports:
    get:
      operationId: getReunionReports
      tags: [manage]
      summary: Extended analytics report for a reunion
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/ReunionId"
      responses:
        "200":
          description: Full report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReport"
        "403":
          description: Forbidden

  # ── Registrations ────────────────────────────────────────────────────────────
  /registrations:
    post:
      operationId: createRegistration
      tags: [registrations]
      summary: Submit a new reunion registration
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized

  /registrations/mine:
    get:
      operationId: listMyRegistrations
      tags: [registrations]
      summary: List the current user's registrations
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registration"
        "401":
          description: Unauthorized

  /registrations/{id}:
    get:
      operationId: getRegistration
      tags: [registrations]
      summary: Get a single registration with attendees
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registration detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found

  # ── Platform admin ────────────────────────────────────────────────────────────
  /admin/settings:
    patch:
      operationId: adminUpdateSettings
      tags: [admin]
      summary: Enable or disable reunion creation platform-wide
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
        "403":
          description: Forbidden

  /admin/reunions:
    get:
      operationId: adminListReunions
      tags: [admin]
      summary: List all reunions across the platform
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of reunions with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReunionSummary"
        "403":
          description: Forbidden

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all registered users with registration stats
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden

  /admin/users/{id}/admin:
    patch:
      operationId: adminToggleAdminFlag
      tags: [admin]
      summary: Grant or revoke platform-admin access for a user
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleAdminInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
        "404":
          description: Not found

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  parameters:
    ReunionId:
      name: reunionId
      in: path
      required: true
      schema:
        type: integer
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: integer
    AnnouncementId:
      name: announcementId
      in: path
      required: true
      schema:
        type: integer
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: integer
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    PlatformSettings:
      type: object
      required: [reunionCreationEnabled]
      properties:
        reunionCreationEnabled:
          type: boolean

    ShirtSize:
      type: string
      enum: [XS, S, M, L, XL, "2XL", "3XL"]

    PaymentStatus:
      type: string
      enum: [pending, paid, waived]

    ReunionBranch:
      type: object
      required: [id, reunionId, name, sortOrder]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        name:
          type: string
        sortOrder:
          type: integer

    Reunion:
      type: object
      required:
        [id, code, name, startDate, endDate, feePerPerson, paymentHandle, createdAt, branches]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        startDate:
          type: string
          description: "ISO date (YYYY-MM-DD)"
        endDate:
          type: string
          description: "ISO date (YYYY-MM-DD)"
        feePerPerson:
          type: integer
        paymentHandle:
          type: string
        paymentUrl:
          type: ["string", "null"]
        organizerId:
          type: string
        createdAt:
          type: string
          format: date-time
        branches:
          type: array
          items:
            $ref: "#/components/schemas/ReunionBranch"

    ReunionSummary:
      type: object
      required: [reunion, registrationCount, attendeeCount]
      properties:
        reunion:
          $ref: "#/components/schemas/Reunion"
        registrationCount:
          type: integer
        attendeeCount:
          type: integer

    ReunionInput:
      type: object
      required: [name, startDate, endDate, feePerPerson, paymentHandle, branches]
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          minLength: 1
        endDate:
          type: string
          minLength: 1
        feePerPerson:
          type: integer
          minimum: 0
        paymentHandle:
          type: string
          minLength: 1
        paymentUrl:
          type: string
        branches:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1

    ReunionUpdateInput:
      type: object
      required: [name, startDate, endDate, feePerPerson, paymentHandle]
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          minLength: 1
        endDate:
          type: string
          minLength: 1
        feePerPerson:
          type: integer
          minimum: 0
        paymentHandle:
          type: string
          minLength: 1
        paymentUrl:
          type: string

    BranchInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        sortOrder:
          type: integer
          default: 0

    AttendeeInput:
      type: object
      required: [name, shirtSize]
      properties:
        name:
          type: string
          minLength: 1
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        dietaryRestrictions:
          type: string

    Attendee:
      type: object
      required: [id, registrationId, name, shirtSize]
      properties:
        id:
          type: integer
        registrationId:
          type: integer
        name:
          type: string
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        dietaryRestrictions:
          type: ["string", "null"]

    RegistrationInput:
      type: object
      required: [reunionId, branchName, attendees]
      properties:
        reunionId:
          type: integer
        branchName:
          type: string
          minLength: 1
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeInput"
          minItems: 1

    Registration:
      type: object
      required:
        [id, reunionId, userId, branchName, attendeeCount, createdAt, attendees, paymentStatus]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        reunionName:
          type: ["string", "null"]
        reunionCode:
          type: ["string", "null"]
        userId:
          type: string
        branchName:
          type: string
        attendeeCount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        createdAt:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"

    AdminRegistration:
      type: object
      required:
        [id, reunionId, userId, branchName, attendeeCount, createdAt, attendees, paymentStatus, userEmail]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        userId:
          type: string
        userEmail:
          type: string
        userName:
          type: ["string", "null"]
        branchName:
          type: string
        attendeeCount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        createdAt:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"

    UpdatePaymentStatusInput:
      type: object
      required: [paymentStatus]
      properties:
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"

    RegistrationSummary:
      type: object
      required: [totalRegistrations, totalAttendees, byGroup]
      properties:
        totalRegistrations:
          type: integer
        totalAttendees:
          type: integer
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"

    GroupCount:
      type: object
      required: [branchName, registrationCount, attendeeCount]
      properties:
        branchName:
          type: string
        registrationCount:
          type: integer
        attendeeCount:
          type: integer

    ShirtSizeCount:
      type: object
      required: [shirtSize, count]
      properties:
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        count:
          type: integer

    DayRegistrationCount:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer

    AdminReport:
      type: object
      required:
        [totalRegistrations, totalAttendees, paidCount, pendingCount, waivedCount, dietaryCount, byGroup, byShirtSize, registrationsOverTime]
      properties:
        totalRegistrations:
          type: integer
        totalAttendees:
          type: integer
        paidCount:
          type: integer
        pendingCount:
          type: integer
        waivedCount:
          type: integer
        dietaryCount:
          type: integer
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"
        byShirtSize:
          type: array
          items:
            $ref: "#/components/schemas/ShirtSizeCount"
        registrationsOverTime:
          type: array
          items:
            $ref: "#/components/schemas/DayRegistrationCount"

    Announcement:
      type: object
      required: [id, reunionId, title, body, createdAt]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        pinned:
          type: boolean

    AnnouncementInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        pinned:
          type: boolean
          default: false

    ScheduleItem:
      type: object
      required: [id, reunionId, title, startTime, day]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        day:
          type: string
          description: "Day label, e.g. Thursday July 17"
        startTime:
          type: string
          description: "Time string, e.g. 9:00 AM"
        endTime:
          type: ["string", "null"]
        title:
