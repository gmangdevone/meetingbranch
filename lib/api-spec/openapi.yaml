        cashAppTag:
          type: ["string", "null"]
        paymentHandle:
          type: ["string", "null"]
        paymentUrl:
          type: ["string", "null"]
        zelleRecipientName:
          type: ["string", "null"]
        zelleContact:
          type: ["string", "null"]
        paymentInstructions:
          type: ["string", "null"]
    MemberProfile:
      type: object
      required: [firstName, lastName, isNewAccount]
      properties:
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        isNewAccount:
          type: boolean
    MemberProfileInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
    HealthStatus:
