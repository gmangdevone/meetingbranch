      properties:
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/Vendor"

    SponsorshipContributionInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1
        contributorName:
          type: ["string", "null"]

    SponsorshipContribution:
      type: object
      required: [id, amount, source, paymentStatus, createdAt]
      properties:
        id:
          type: integer
        registrationId:
          type: ["integer", "null"]
        contributorName:
          type: ["string", "null"]
        amount:
          type: number
        source:
          type: string
          enum: [registration, direct, cancellation]
        paymentStatus:
          type: string
          enum: [pending, paid, waived]
          description: "Pledged money is pending until an organizer confirms it arrived. Only paid contributions count toward the fund balance."
        createdAt:
          type: string
          format: date-time

    SponsorshipAllocationInput:
      type: object
      required: [registrationId, amount, fundedFrom]
      properties:
        registrationId:
          type: integer
        amount:
          type: integer
          minimum: 1
        fundedFrom:
          type: string
          enum: [fund, direct]
        sponsorName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]

    SponsorshipAllocation:
      type: object
      required: [id, registrationId, amount, fundedFrom, createdAt]
      properties:
        id:
          type: integer
        registrationId:
          type: integer
        registrantName:
          type: ["string", "null"]
        registrantEmail:
          type: ["string", "null"]
        branchName:
          type: ["string", "null"]
        amount:
          type: integer
        fundedFrom:
          type: string
          enum: [fund, direct]
        sponsorName:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SponsorshipFund:
      type: object
      required: [balance, totalContributed, totalPending, totalAllocated, contributions, allocations]
      properties:
        balance:
          type: number
          description: totalContributed (paid only) minus fund-funded allocations
        totalContributed:
          type: number
          description: sum of contributions actually received (paymentStatus paid)
        totalPending:
          type: number
          description: sum of pledged contributions not yet received (paymentStatus pending)
        totalAllocated:
          type: number
          description: total applied from the fund (excludes direct sponsorships)
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/SponsorshipContribution"
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/SponsorshipAllocation"

    ReunionBranch:
      type: object
      required: [id, reunionId, name, sortOrder]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        name:
          type: string
        sortOrder:
          type: integer
        specialFeeEnabled:
          type: boolean
          description: Whether this branch has its one shared, one-time special fee turned on. Opt-in only; never added to registration dues.
        specialFeeLabel:
          type: ["string", "null"]
        specialFeeCents:
          type: integer
          description: The shared fee amount for the whole branch, in cents (once per branch, not per registration).
        archivedAt:
          type: ["string", "null"]
          format: date-time

    BranchSpecialFeeInput:
      type: object
      required: [enabled, label, amountCents]
      properties:
        enabled: { type: boolean }
        label: { type: string, minLength: 1, maxLength: 60 }
        amountCents: { type: integer, minimum: 0, maximum: 10000000 }

    BranchFeeEntry:
      type: object
      required: [receiptId, kind, cents, createdAt, reversed, legacy]
      properties:
        receiptId: { type: integer }
        kind: { type: string }
        cents: { type: integer }
        method: { type: string, nullable: true }
        receivedDate: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        reversed: { type: boolean }
        reversalReason: { type: string, nullable: true }
        legacy: { type: boolean, description: "Pooled partial money from the earlier model. Kept for review; never marks the fee paid." }
        payerName:
          type: string
          nullable: true
          description: Organizer view only.

    BranchFeeElectionSummary:
      type: object
      required: [id, status, amountCents, createdAt]
      properties:
        id: { type: integer }
        status: { type: string, enum: [unpaid, reported, paid] }
        amountCents: { type: integer }
        createdAt: { type: string, format: date-time }
        userName: { type: string, nullable: true }
        userEmail: { type: string, nullable: true }
        pendingSubmissionId: { type: integer, nullable: true }

    BranchFeeLedger:
      type: object
      required: [branchId, branchName, label, enabled, archived, amountCents, state, paidCents, legacyCents, entries]
      properties:
        branchId: { type: integer }
        branchName: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        archived: { type: boolean }
        amountCents: { type: integer, description: Configured full fee. }
        state: { type: string, enum: [off, open, elected, reported, paid, legacy_review], description: "off: not collecting; open: nobody has elected; elected/reported: an unpaid election; paid: confirmed in full (by an election, or by legacy pooled money covering the full fee); legacy_review: partial legacy pooled money awaits organizer review, so new elections are blocked." }
        paidCents: { type: integer, description: Confirmed full-fee payment (0 until paid). }
        legacyCents: { type: integer, description: Non-reversed pooled partial money from the earlier model, for review. }
        election:
          oneOf:
            - $ref: "#/components/schemas/BranchFeeElectionSummary"
            - type: "null"
        entries: { type: array, items: { $ref: "#/components/schemas/BranchFeeEntry" } }

    BranchFeeOutstanding:
      type: object
      required: [branchId, branchName, label, amountCents, elected]
      properties:
        branchId: { type: integer }
        branchName: { type: string }
        label: { type: string }
        amountCents: { type: integer }
        elected: { type: boolean }

    BranchFeeSummary:
      type: object
      required: [paidCount, paidCents, outstandingCount, outstandingCents, outstanding]
      properties:
        paidCount: { type: integer }
        paidCents: { type: integer }
        outstandingCount: { type: integer }
        outstandingCents: { type: integer }
        outstanding: { type: array, items: { $ref: "#/components/schemas/BranchFeeOutstanding" } }

    BranchFeeLedgerList:
      type: object
      required: [branches, summary]
      properties:
        branches: { type: array, items: { $ref: "#/components/schemas/BranchFeeLedger" } }
        summary: { $ref: "#/components/schemas/BranchFeeSummary" }

    BranchFeeOption:
      type: object
      required: [branchId, branchName, label, amountCents, state]
      properties:
        branchId: { type: integer }
        branchName: { type: string }
        label: { type: string }
        amountCents: { type: integer }
        state:
          type: string
          enum: [available, yours_unpaid, yours_reported, yours_paid, paid, claimed, under_review, yours_disabled]
          description: "claimed: another member elected it (identity hidden)."
        electionId: { type: integer, nullable: true, description: Only for the member's own election. }

    BranchFeeOptionList:
      type: object
      required: [options]
      properties:
        options: { type: array, items: { $ref: "#/components/schemas/BranchFeeOption" } }

    BranchFeeElectionInput:
      type: object
      required: [branchId, expectedAmountCents]
      properties:
        branchId: { type: integer }
        expectedAmountCents: { type: integer, description: The full fee the member saw; a mismatch returns 409 so they can re-confirm. }

    MyBranchFeeElection:
      type: object
      required: [id, reunionId, branchId, branchName, label, amountCents, status, collecting, createdAt, history]
      properties:
        id: { type: integer }
        collecting: { type: boolean, description: "False when the branch fee is turned off or the branch removed; unpaid elections then can't be paid." }
        reunionId: { type: integer }
        branchId: { type: integer }
        branchName: { type: string }
        label: { type: string }
        amountCents: { type: integer }
        status: { type: string, enum: [unpaid, reported, paid] }
        createdAt: { type: string, format: date-time }
        pendingSubmissionId: { type: integer, nullable: true }
        history: { type: array, items: { $ref: "#/components/schemas/BranchFeeEntry" } }

    MyBranchFeeElectionList:
      type: object
      required: [elections]
      properties:
        elections: { type: array, items: { $ref: "#/components/schemas/MyBranchFeeElection" } }

    BranchFeePaymentInput:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [cashapp, zelle, cash, check] }
        reference: { type: string, nullable: true, maxLength: 200 }
        givenDate: { type: string, nullable: true }
        note: { type: string, nullable: true, maxLength: 1000 }

    SubmissionBranchFee:
      type: object
      required: [branchId, label, amountCents]
      properties:
        branchId: { type: integer }
        electionId: { type: integer, nullable: true }
        branchName: { type: string, nullable: true }
        label: { type: string }
        amountCents: { type: integer }

    Reunion:
      type: object
      required:
        [id, code, name, startDate, endDate, registrationsOpen, createdAt, branches, fees, paymentRecipient]
      properties:
        id:
          type: integer
        code:
          type: string
          minLength: 7
          maxLength: 32
          pattern: '^(?=.*[A-Z])(?=.*[0-9])[A-Z0-9*._~-]+$'
          description: "Unique Event Code. Read responses may contain a safe uppercase alphanumeric legacy code created before 2026-08-27; all modern codes also contain a URL-safe special character."
        name:
          type: string
        startDate:
          type: string
          description: "ISO date (YYYY-MM-DD)"
        endDate:
          type: string
          description: "ISO date (YYYY-MM-DD)"
        paymentHandle:
          type: ["string", "null"]
          description: "Owner-approved generic payment label. Null unless the recipient is approved."
        paymentUrl:
          type: ["string", "null"]
          description: "Owner-approved Cash App link. Null unless the recipient is approved."
        paymentRecipient:
          $ref: "#/components/schemas/PaymentRecipientPublic"
        registrationsOpen:
          type: boolean
        allowRegistrantEdits:
          type: boolean
          description: "When true, registrants may edit their own active registrations."
        heroImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom hub hero background image (e.g. /objects/uploads/uuid). Null means the default background."
        heroImageUrls:
          type: array
          maxItems: 5
          items:
            type: string
          description: "Ordered hero slideshow images (object paths, up to 5). Empty means no slideshow; heroImageUrl/default applies."
        heroRotationSeconds:
          type: integer
          minimum: 3
          maximum: 8
          description: "Seconds between hero slides (3-8)."
        scheduleCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom background image for the hub Schedule card. Null means the default look."
        announcementsCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom background image for the hub Announcements card. Null means the default look."
        pollsCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom background image for the hub Family Vote card. Null means the default look."
        cashAppTag:
          type: ["string", "null"]
          description: "Owner-approved receiving Cash App tag (no leading $). Null unless the recipient is approved."
        checkPayee:
          type: ["string", "null"]
          description: "Who checks should be made out to. Null hides the check payment option."
        organizerId:
          type: string
        createdAt:
          type: string
          format: date-time
        branches:
          type: array
          items:
            $ref: "#/components/schemas/ReunionBranch"
        fees:
          type: array
          items:
            $ref: "#/components/schemas/ReunionFee"

    FeeChargeType:
      type: string
      enum: [per_person, flat]
      description: "per_person = charged once per attendee; flat = one flat amount per registration/household"

    ReunionFee:
      type: object
      required: [id, reunionId, label, chargeType, isOptional, amount, sortOrder]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        label:
          type: string
        chargeType:
          $ref: "#/components/schemas/FeeChargeType"
        isOptional:
          type: boolean
        amount:
          type: integer
          description: "Base amount — what attendees matching no age tier (or with no age on file) pay, or the flat amount"
        ageTiers:
          type: array
          items:
            $ref: "#/components/schemas/FeeAgeTier"
          description: "Age-bracket price overrides. Only applies to per_person fees."
        sortOrder:
          type: integer

    FeeAgeTier:
      type: object
      required: [minAge, maxAge, amount]
      description: "An attendee whose age is within [minAge, maxAge] (inclusive) pays this tier's amount instead of the fee's base amount. A null minAge means 'this age and below' (no lower bound); a null maxAge means 'this age and above' (no upper bound). At least one bound must be set."
      properties:
        minAge:
          type: ["integer", "null"]
          minimum: 0
        maxAge:
          type: ["integer", "null"]
          minimum: 0
        amount:
          type: integer
          minimum: 0

    FeeInput:
      type: object
      required: [label, chargeType, amount]
      properties:
        label:
          type: string
          minLength: 1
        chargeType:
          $ref: "#/components/schemas/FeeChargeType"
        isOptional:
          type: boolean
          default: false
        amount:
          type: integer
          minimum: 0
        ageTiers:
          type: array
          items:
            $ref: "#/components/schemas/FeeAgeTier"
          default: []
        sortOrder:
          type: integer
          default: 0

    ReunionRole:
      type: string
      enum: [registration, announcements, schedule, branches, reports, scout, power_user]
      description: >-
        A delegable management area a co-organizer can be granted. scout covers
        vendor management. power_user covers editing reunion details, payment,
        and fees & dues (but not managing organizers or transferring ownership,
        which stay owner-only).

    ReunionOrganizer:
      type: object
      required: [userId, email, isOwner, roles]
      properties:
        userId:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        isOwner:
          type: boolean
          description: True for the reunion creator/owner; false for added co-organizers
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ReunionRole"
          description: >-
            The roles granted to this co-organizer. Empty for the owner (whose
            access is implicit and full).

    ReunionViewerPermissions:
      type: object
      required: [isOwner, isAdmin, canManageOrganizers, roles]
      properties:
        isOwner:
          type: boolean
        isAdmin:
          type: boolean
        canManageOrganizers:
          type: boolean
          description: True only for the owner or a platform admin (add/remove organizers, assign roles, transfer ownership).
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ReunionRole"
          description: >-
            Effective roles for the current viewer. Owners and platform admins
            receive every role; co-organizers receive their assigned set.

    AddOrganizerInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ReunionRole"
          description: Roles to grant the new co-organizer. Defaults to none.

    UpdateOrganizerRolesInput:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ReunionRole"

    TransferOwnershipInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          minLength: 1
          description: The user id of an existing co-organizer to promote to owner

    EventMembership:
      type: object
      required: [reunionId, code, name, startDate, endDate, isOrganizer, isCoOrganizer, activeRegistrationCount, activeBranchFeeElectionCount]
      properties:
        reunionId:
          type: integer
        code:
          type: string
        name:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        isOrganizer:
          type: boolean
        isCoOrganizer:
          type: boolean
        activeBranchFeeElectionCount:
          type: integer
          description: Active branch fees this member chose to pay (fee-only members have no registration). Not headcount.
        activeRegistrationCount:
          type: integer
    ReunionSummary:
      type: object
      required: [reunion, registrationCount, attendeeCount]
      properties:
        reunion:
          $ref: "#/components/schemas/Reunion"
        registrationCount:
          type: integer
        attendeeCount:
          type: integer
        viewer:
          $ref: "#/components/schemas/ReunionViewerPermissions"
          description: >-
            The current viewer's permissions for this reunion. Populated by the
            manage detail endpoint (GET /reunions/{reunionId}); omitted elsewhere.

    ReunionInput:
      type: object
      required: [name, startDate, endDate, feePerPerson, branches]
      properties:
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          minLength: 1
        endDate:
          type: string
          minLength: 1
        feePerPerson:
          type: integer
          minimum: 0
          description: "Seed amount for the initial per-person 'Registration Fee'. More fees & dues can be added afterwards from settings."
        branches:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1

    ReunionUpdateInput:
      type: object
      description: "Partial update — only provided fields are changed."
      properties:
        code:
          type: string
          minLength: 7
          maxLength: 32
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[*._~-])[A-Za-z0-9*._~-]+$'
          description: "Unique event code. Letters are normalized to uppercase."
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          minLength: 1
        endDate:
          type: string
          minLength: 1
        registrationsOpen:
          type: boolean
        allowRegistrantEdits:
          type: boolean
        heroImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom hub hero background image. Set null to restore the default."
        heroImageUrls:
          type: array
          maxItems: 5
          items:
            type: string
          description: "Ordered hero slideshow images (object paths, up to 5). Pass [] to clear the slideshow."
        heroRotationSeconds:
          type: integer
          minimum: 3
          maximum: 8
          description: "Seconds between hero slides (3-8)."
        scheduleCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom Schedule card background. Set null to restore the default."
        announcementsCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom Announcements card background. Set null to restore the default."
        pollsCardImageUrl:
          type: ["string", "null"]
          description: "Object path of a custom Family Vote card background. Set null to restore the default."
        checkPayee:
          type: ["string", "null"]
          description: "Who checks should be made out to. Set null to hide the check payment option."

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BranchInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        sortOrder:
          type: integer
          default: 0

    AttendeeInput:
      type: object
      required: [name, shirtSize]
      properties:
        name:
          type: string
          minLength: 1
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        dietaryRestrictions:
          type: string
        age:
          type: ["integer", "null"]
          minimum: 0

    Attendee:
      type: object
      required: [id, registrationId, name, shirtSize]
      properties:
        id:
          type: integer
        registrationId:
          type: integer
        name:
          type: string
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        dietaryRestrictions:
          type: ["string", "null"]
        age:
          type: ["integer", "null"]
        checkedInAt:
          type: ["string", "null"]
          format: date-time
          description: When the attendee was checked in at the event; null if not checked in.

    CheckInInput:
      type: object
      required: [checkedIn]
      properties:
        checkedIn:
          type: boolean

    PollInput:
      type: object
      required: [question, maxVotesPerMember, options]
      properties:
        question:
          type: string
          minLength: 1
        maxVotesPerMember:
          type: integer
          minimum: 1
          maximum: 20
        options:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 2

    PollUpdateInput:
      type: object
      properties:
        question:
          type: string
          minLength: 1
        maxVotesPerMember:
          type: integer
          minimum: 1
          maximum: 20
        isOpen:
          type: boolean
        resultsRevealed:
          type: boolean
        liveResults:
          type: boolean

    PollOptionInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1

    PollOption:
      type: object
      required: [id, pollId, label, position]
      properties:
        id:
          type: integer
        pollId:
          type: integer
        label:
          type: string
        position:
          type: integer

    Poll:
      type: object
      required: [id, reunionId, question, maxVotesPerMember, isOpen, resultsRevealed, liveResults, createdAt, options]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        question:
          type: string
        maxVotesPerMember:
          type: integer
        isOpen:
          type: boolean
        resultsRevealed:
          type: boolean
        liveResults:
          type: boolean
        createdAt:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"

    PollOptionResult:
      type: object
      required: [optionId, label, voteCount]
      properties:
        optionId:
          type: integer
        label:
          type: string
        voteCount:
          type: integer
        voters:
          type: array
          items:
            type: string
          description: Voter display names. Only present in the organizer view.

    MemberPoll:
      type: object
      required: [poll, myOptionIds, canVote]
      properties:
        poll:
          $ref: "#/components/schemas/Poll"
        myOptionIds:
          type: array
          items:
            type: integer
        canVote:
          type: boolean
          description: True when the poll is open and the viewer is checked in.
        results:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionResult"
          description: Summarized results; only present when the organizer has revealed them.

    MemberPollList:
      type: object
      required: [eligible, polls]
      properties:
        eligible:
          type: boolean
          description: Whether the viewer is checked in and allowed to vote in this reunion.
        polls:
          type: array
          items:
            $ref: "#/components/schemas/MemberPoll"

    ManagePoll:
      type: object
      required: [poll, totalVoters, results]
      properties:
        poll:
          $ref: "#/components/schemas/Poll"
        totalVoters:
          type: integer
          description: Number of distinct members who have voted on this poll.
        results:
          type: array
          items:
            $ref: "#/components/schemas/PollOptionResult"

    CastVotesInput:
      type: object
      required: [optionIds]
      properties:
        optionIds:
          type: array
          items:
            type: integer
          description: The full set of options the member is voting for (replaces previous votes).

    ActivityChoiceGroupInput:
      type: object
      required: [title, maxSelectionsPerRegistrant, options]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        maxSelectionsPerRegistrant:
          type: integer
          minimum: 1
          maximum: 20
        options:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 2

    ActivityChoiceGroupUpdateInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        maxSelectionsPerRegistrant:
          type: integer
          minimum: 1
          maximum: 20
        isOpen:
          type: boolean
        resultsRevealed:
          type: boolean
        liveResults:
          type: boolean

    ActivityChoiceOptionInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1

    ActivityChoiceOption:
      type: object
      required: [id, groupId, label, position]
      properties:
        id:
          type: integer
        groupId:
          type: integer
        label:
          type: string
        position:
          type: integer

    ActivityChoiceGroup:
      type: object
      required: [id, reunionId, title, description, maxSelectionsPerRegistrant, isOpen, resultsRevealed, liveResults, createdAt, options]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        maxSelectionsPerRegistrant:
          type: integer
        isOpen:
          type: boolean
        resultsRevealed:
          type: boolean
        liveResults:
          type: boolean
        createdAt:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: "#/components/schemas/ActivityChoiceOption"

    ActivityChoiceOptionResult:
      type: object
      required: [optionId, label, selectionCount]
      properties:
        optionId:
          type: integer
        label:
          type: string
        selectionCount:
          type: integer
        registrants:
          type: array
          items:
            type: string
          description: Registrant display names. Only present in the organizer view.

    MemberActivityChoice:
      type: object
      required: [group, myOptionIds, canSelect]
      properties:
        group:
          $ref: "#/components/schemas/ActivityChoiceGroup"
        myOptionIds:
          type: array
          items:
            type: integer
        canSelect:
          type: boolean
          description: True when the group is open and the viewer has an active registration.
        results:
          type: array
          items:
            $ref: "#/components/schemas/ActivityChoiceOptionResult"

    MemberActivityChoiceList:
      type: object
      required: [eligible, groups]
      properties:
        eligible:
          type: boolean
          description: Whether the viewer has an active registration and may make selections.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/MemberActivityChoice"

    ManageActivityChoice:
      type: object
      required: [group, totalRegistrants, results]
      properties:
        group:
          $ref: "#/components/schemas/ActivityChoiceGroup"
        totalRegistrants:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/ActivityChoiceOptionResult"

    ActivityChoiceSelectionsInput:
      type: object
      required: [optionIds]
      properties:
        optionIds:
          type: array
          items:
            type: integer
          description: The full set of options selected, replacing previous selections.

    ManagedRegistrationInput:
      type: object
      required: [memberFirstName, branchName, attendees]
      properties:
        memberFirstName:
          type: string
          minLength: 1
        memberLastName:
          type: string
        branchName:
          type: string
          minLength: 1
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeInput"
          minItems: 1
        selectedFeeIds:
          type: array
          items:
            type: integer

    RegistrationInput:
      type: object
      required: [reunionId, branchName, attendees]
      properties:
        reunionId:
          type: integer
        branchName:
          type: string
          minLength: 1
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/AttendeeInput"
          minItems: 1
        selectedFeeIds:
          type: array
          items:
            type: integer
          description: "IDs of OPTIONAL fees this household opted into. Mandatory fees always apply."
        sponsorshipContribution:
          type: integer
          minimum: 1
          description: "Optional extra amount donated to the reunion's sponsorship fund."

    Registration:
      type: object
      required:
        [id, reunionId, userId, branchName, attendeeCount, createdAt, attendees, paymentStatus, status]
      properties:
        ledger:
          $ref: "#/components/schemas/RegistrationLedger"
        id:
          type: integer
        reunionId:
          type: integer
        reunionName:
          type: ["string", "null"]
        reunionCode:
          type: ["string", "null"]
        userId:
          type: string
        branchName:
          type: string
        attendeeCount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        status:
          $ref: "#/components/schemas/RegistrationStatus"
        cancellationResolution:
          oneOf:
            - $ref: "#/components/schemas/CancellationResolution"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
        selectedFeeIds:
          type: array
          items:
            type: integer

    AdminRegistration:
      type: object
      required:
        [id, reunionId, userId, branchName, attendeeCount, createdAt, attendees, paymentStatus, userEmail, status, registrantIsManaged]
      properties:
        ledger:
          $ref: "#/components/schemas/RegistrationLedger"
        id:
          type: integer
        reunionId:
          type: integer
        userId:
          type: string
        userEmail:
          type: string
        userName:
          type: ["string", "null"]
        registrantIsManaged:
          type: boolean
          description: "True when this registration was created by an organizer on behalf of a member without their own account"
        branchName:
          type: string
        attendeeCount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        status:
          $ref: "#/components/schemas/RegistrationStatus"
        cancellationResolution:
          oneOf:
            - $ref: "#/components/schemas/CancellationResolution"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/Attendee"
        selectedFeeIds:
          type: array
          items:
            type: integer

    UpdatePaymentStatusInput:
      type: object
      required: [paymentStatus]
      properties:
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"

    RegistrationSummary:
      type: object
      required: [totalRegistrations, totalAttendees, byGroup]
      properties:
        totalRegistrations:
          type: integer
        totalAttendees:
          type: integer
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"

    GroupCount:
      type: object
      required: [branchName, registrationCount, attendeeCount]
      properties:
        branchName:
          type: string
        registrationCount:
          type: integer
        attendeeCount:
          type: integer

    ShirtSizeCount:
      type: object
      required: [shirtSize, count]
      properties:
        shirtSize:
          $ref: "#/components/schemas/ShirtSize"
        count:
          type: integer

    DayRegistrationCount:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer

    LedgerStatus:
      type: string
      enum: [unpaid, partial, paid, waived]
    AttachedContributionLedger:
      type: object
      required: [id, pledgedCents, confirmedCents, outstandingCents]
      properties:
        id: { type: integer }
        pledgedCents: { type: integer }
        confirmedCents: { type: integer }
        outstandingCents: { type: integer }
    RegistrationLedger:
      type: object
      description: Server-authoritative balance in exact cents. Pending reported payments never reduce balanceCents.
      required: [registrationId, chargeCents, sponsoredCents, confirmedCents, legacyCreditCents, waived, waivedCents, balanceCents, creditCents, pendingReportedCents, status, legacyPending, contributions]
      properties:
        registrationId: { type: integer }
        chargeCents: { type: integer }
        sponsoredCents: { type: integer }
        confirmedCents: { type: integer }
        legacyCreditCents: { type: integer }
        waived: { type: boolean }
        waivedCents: { type: integer }
        balanceCents: { type: integer }
        creditCents: { type: integer }
        pendingReportedCents: { type: integer }
        status: { $ref: "#/components/schemas/LedgerStatus" }
        legacyPending: { type: boolean }
        contributions:
          type: array
          items: { $ref: "#/components/schemas/AttachedContributionLedger" }
    LedgerReversal:
      type: object
      required: [at]
      properties:
        at: { type: string, format: date-time }
        reason: { type: string, nullable: true }
        byName: { type: string, nullable: true }
    LedgerEntry:
      type: object
      required: [id, kind, totalCents, registrationCents, contributionCents, createdAt]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [payment, legacy_credit, transfer] }
        totalCents: { type: integer }
        registrationCents: { type: integer }
        contributionCents: { type: integer }
        method: { type: string, nullable: true }
        receivedDate: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        note: { type: string, nullable: true }
        submissionId: { type: integer, nullable: true }
        replacesReceiptId: { type: integer, nullable: true }
        recordedByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        reversed:
          allOf: [{ $ref: "#/components/schemas/LedgerReversal" }]
          nullable: true
    PendingReportedPayment:
      type: object
      required: [id, method, amountCents, createdAt, registrationIds]
      properties:
        id: { type: integer }
        method: { type: string }
        amountCents: { type: integer }
        createdAt: { type: string, format: date-time }
        reference: { type: string, nullable: true }
        registrationIds: { type: array, items: { type: integer } }
    RegistrationLedgerResponse:
      type: object
      required: [ledger, entries, pendingSubmissions, canManage]
      properties:
        ledger: { $ref: "#/components/schemas/RegistrationLedger" }
        entries: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
        pendingSubmissions: { type: array, items: { $ref: "#/components/schemas/PendingReportedPayment" } }
        canManage: { type: boolean }
    ReceiptAllocationInput:
      type: object
      required: [amountCents]
      properties:
        registrationId: { type: integer, nullable: true }
        contributionId: { type: integer, nullable: true }
        standaloneContributionId:
          type: integer
          nullable: true
          description: Standalone (unattached) fund chip-in included in the reported payment. All-or-nothing; amount must equal its full pledge.
        branchId:
          type: integer
          nullable: true
          description: Branch special fee. Pays the branch's active election IN FULL (amount must equal it); a branch can be marked paid only once.
        amountCents: { type: integer }
    ReceiptInput:
      type: object
      required: [amountCents, method, receivedDate, allocations, idempotencyKey]
      properties:
        amountCents: { type: integer }
        method: { type: string, enum: [cashapp, zelle, cash, check, other] }
        receivedDate: { type: string, description: "YYYY-MM-DD" }
        reference: { type: string, nullable: true }
        note: { type: string, nullable: true }
        allocations: { type: array, items: { $ref: "#/components/schemas/ReceiptAllocationInput" } }
        submissionId: { type: integer, nullable: true }
        replacesReceiptId: { type: integer, nullable: true }
        idempotencyKey: { type: string }
    ReceiptResult:
      type: object
      required: [receiptId, ledgers]
      properties:
        receiptId: { type: integer }
        duplicate: { type: boolean }
        ledgers: { type: array, items: { $ref: "#/components/schemas/RegistrationLedger" } }
    ReceiptReversalInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    FinanceSummary:
      type: object
      required: [chargesCents, confirmedCents, legacyCreditCents, sponsoredCents, waivedCents, outstandingCents, creditCents, pendingReportedCents]
      properties:
        chargesCents: { type: integer }
        confirmedCents: { type: integer }
        legacyCreditCents: { type: integer }
        sponsoredCents: { type: integer }
        waivedCents: { type: integer }
        outstandingCents: { type: integer }
        creditCents: { type: integer }
        pendingReportedCents: { type: integer }
    AdminReport:
      type: object
      required:
        [totalRegistrations, totalAttendees, paidCount, pendingCount, waivedCount, dietaryCount, byGroup, byShirtSize, registrationsOverTime]
      properties:
        totalRegistrations:
          type: integer
        totalAttendees:
          type: integer
        paidCount:
          type: integer
        pendingCount:
          type: integer
        waivedCount:
          type: integer
        unpaidCount:
          type: integer
        partialCount:
          type: integer
        finance:
          $ref: "#/components/schemas/FinanceSummary"
        dietaryCount:
          type: integer
        byGroup:
          type: array
          items:
            $ref: "#/components/schemas/GroupCount"
        byShirtSize:
          type: array
          items:
            $ref: "#/components/schemas/ShirtSizeCount"
        registrationsOverTime:
          type: array
          items:
            $ref: "#/components/schemas/DayRegistrationCount"

    Announcement:
      type: object
      required: [id, reunionId, title, body, createdAt]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        pinned:
          type: boolean

    AnnouncementInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        pinned:
          type: boolean
          default: false

    ScheduleItem:
      type: object
      required: [id, reunionId, title, startTime, day]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        day:
          type: string
          description: "Day label, e.g. Thursday July 17"
        startTime:
          type: string
          description: "Time string, e.g. 9:00 AM"
        endTime:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        sortOrder:
          type: integer

    ScheduleItemInput:
      type: object
      required: [day, startTime, title]
      properties:
        day:
          type: string
          minLength: 1
        startTime:
          type: string
          minLength: 1
        endTime:
          type: string
        title:
          type: string
          minLength: 1
        description:
          type: string
        location:
          type: string
        sortOrder:
          type: integer
          default: 0

    AdminUser:
      type: object
      required: [id, email, isAdmin, createdAt, registrationCount, attendeeCount]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        isAdmin:
          type: boolean
        registrationCount:
          type: integer
        attendeeCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    AdminRemoveUserInput:
      type: object
      required: [deleteRegistrations]
      properties:
        deleteRegistrations:
          type: boolean
          description: >
            When true, the user's registrations (with attendees and optional-fee
            selections) are deleted too. When false, registrations are kept on
            record but the user account is removed.

    ToggleAdminInput:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean

    AdminSetupStatus:
      type: object
      required: [adminExists]
      properties:
        adminExists:
          type: boolean

    AdminSetupResult:
      type: object
      required: [success, message, userId]
      properties:
        success:
          type: boolean
        message:
          type: string
        userId:
          type: string
