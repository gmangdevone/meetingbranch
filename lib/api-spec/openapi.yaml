          type: integer
        reunionId:
          type: integer
        fileName:
          type: string
        objectPath:
          type: string
        uploadedBy:
          type: string
        createdAt:
          type: string
          format: date-time

    Vendor:
      type: object
      required: [id, reunionId, name, category, status, createdAt, contracts]
      properties:
        id:
          type: integer
        reunionId:
          type: integer
        name:
          type: string
        category:
          $ref: "#/components/schemas/VendorCategory"
        status:
          $ref: "#/components/schemas/VendorStatus"
        contactName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        quotedCost:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        serviceDate:
          type: ["string", "null"]
        serviceEndDate:
          type: ["string", "null"]
        serviceStartTime:
          type: ["string", "null"]
        serviceEndTime:
          type: ["string", "null"]
        approvedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        contracts:
          type: array
